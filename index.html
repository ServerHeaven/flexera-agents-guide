<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexNet Agents — Guía de Instalación y Configuración</title>
  <meta name="description" content="Guía completa de instalación y configuración de FlexNet Agents de Flexera para Windows, Linux, macOS y Contenedores." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0a0e1a; color: #e0e0e0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    code { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; background: #1a2332; padding: 1px 6px; border-radius: 4px; font-size: 0.9em; color: #f48c06; }
    pre code { background: none; padding: 0; }
    details summary::-webkit-details-marker { display: none; }
    details[open] summary span.arrow { transform: rotate(90deg); display: inline-block; }
    ::selection { background: #f48c0644; color: #fff; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }
    @media (max-width: 768px) {
      .layout { flex-direction: column !important; }
      .sidebar { position: static !important; min-width: 0 !important; }
      .sidebar-inner { display: flex; flex-wrap: wrap; gap: 4px; }
      .sidebar-inner button { flex: 1; min-width: 100px; padding: 8px 10px !important; font-size: 12px !important; }
      .sidebar-inner button span.icon { display: none; }
      .main-content { padding: 20px 16px !important; }
      .header-title { font-size: 18px !important; }
      .cards-grid { grid-template-columns: 1fr !important; }
      .arch-diagram { font-size: 11px !important; overflow-x: auto; }
      .sources-box { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useEffect, useContext, createContext } = React;

    /* ─── i18n ─── */

    const META = {
      es: {
        title: 'FlexNet Agents — Guía de Instalación y Configuración',
        description: 'Guía completa de instalación y configuración de FlexNet Agents de Flexera para Windows, Linux, macOS y Contenedores.',
      },
      en: {
        title: 'FlexNet Agents — Installation and Configuration Guide',
        description: 'Complete installation and configuration guide for Flexera FlexNet Agents on Windows, Linux, macOS and Containers.',
      },
    };

    function detectLang() {
      try {
        const q = new URLSearchParams(window.location.search).get('lang');
        if (q === 'es' || q === 'en') return q;
      } catch (e) {}
      try {
        const saved = window.localStorage.getItem('flexera-guide-lang');
        if (saved === 'es' || saved === 'en') return saved;
      } catch (e) {}
      const nav = (navigator.language || 'es').toLowerCase();
      return nav.startsWith('es') ? 'es' : 'en';
    }

    const LangContext = createContext({ lang: 'es', t: (es) => es });
    const useLang = () => useContext(LangContext);

    /* ─── Utility Components ─── */

    function CodeBlock({ children, title }) {
      const { t } = useLang();
      const [copied, setCopied] = useState(false);
      const handleCopy = useCallback(() => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(children);
        } else {
          const ta = document.createElement('textarea');
          ta.value = children;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }, [children]);

      return (
        <div style={{ margin: '16px 0', borderRadius: 8, overflow: 'hidden', border: '1px solid #2a2a3a' }}>
          {title && (
            <div style={{ background: '#1a1a2e', padding: '8px 16px', fontSize: 12, color: '#8892b0', fontFamily: "'SF Mono', Consolas, monospace", display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
              <span>{title}</span>
              <button onClick={handleCopy} style={{ background: 'none', border: '1px solid #333', color: copied ? '#26a269' : '#8892b0', padding: '2px 10px', borderRadius: 4, cursor: 'pointer', fontSize: 11, transition: 'color 0.2s' }}>
                {copied ? t('✓ Copiado', '✓ Copied') : t('Copiar', 'Copy')}
              </button>
            </div>
          )}
          <pre style={{ background: '#0d1117', padding: 16, margin: 0, overflowX: 'auto', fontSize: 13, lineHeight: 1.6, color: '#c9d1d9', fontFamily: "'SF Mono', Consolas, monospace" }}>
            <code>{children}</code>
          </pre>
        </div>
      );
    }

    function InfoBox({ type = 'info', children }) {
      const { t } = useLang();
      const styles = {
        info:    { bg: '#0d2847', border: '#1a5fb4', icon: 'ℹ️', label: t('Información', 'Information') },
        warning: { bg: '#3d2e00', border: '#c4a000', icon: '⚠️', label: t('Advertencia', 'Warning') },
        danger:  { bg: '#3d0000', border: '#c01c28', icon: '🚨', label: t('Importante', 'Important') },
        tip:     { bg: '#0d3324', border: '#26a269', icon: '💡', label: t('Consejo', 'Tip') },
      };
      const s = styles[type];
      return (
        <div style={{ margin: '16px 0', padding: '14px 18px', borderRadius: 8, background: s.bg, borderLeft: '4px solid ' + s.border, fontSize: 14, lineHeight: 1.7, color: '#e0e0e0' }}>
          <strong style={{ color: s.border }}>{s.icon} {s.label}:</strong>{' '}
          {children}
        </div>
      );
    }

    function StepCard({ number, title, children }) {
      return (
        <div style={{ display: 'flex', gap: 16, margin: '20px 0' }}>
          <div style={{ minWidth: 38, height: 38, borderRadius: '50%', background: 'linear-gradient(135deg, #e85d04, #f48c06)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 16, color: '#fff', flexShrink: 0, marginTop: 2 }}>
            {number}
          </div>
          <div style={{ flex: 1 }}>
            <h4 style={{ margin: '0 0 8px', fontSize: 16, color: '#f0f0f0', fontWeight: 700 }}>{title}</h4>
            <div style={{ color: '#b0b8c8', lineHeight: 1.75, fontSize: 14 }}>{children}</div>
          </div>
        </div>
      );
    }

    function Badge({ children, color = '#e85d04' }) {
      return (
        <span style={{ display: 'inline-block', background: color + '22', color, padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', border: '1px solid ' + color + '44' }}>
          {children}
        </span>
      );
    }

    function TRow({ cells, header }) {
      const Tag = header ? 'th' : 'td';
      return (
        <tr>
          {cells.map((c, i) => (
            <Tag key={i} style={{ padding: '10px 14px', borderBottom: '1px solid #1e2a3a', textAlign: 'left', fontSize: 13, color: header ? '#f48c06' : '#c0c8d8', fontWeight: header ? 700 : 400, background: header ? '#0d1117' : 'transparent' }}>{c}</Tag>
          ))}
        </tr>
      );
    }

    function SubTabs({ tabs, active, onChange }) {
      return (
        <div style={{ display: 'flex', gap: 8, marginBottom: 24, flexWrap: 'wrap' }}>
          {tabs.map(tb => (
            <button key={tb.id} onClick={() => onChange(tb.id)} style={{ padding: '8px 18px', borderRadius: 8, border: active === tb.id ? '1px solid #f48c06' : '1px solid #1e2a3a', background: active === tb.id ? '#f48c0618' : '#111827', color: active === tb.id ? '#f48c06' : '#8892b0', cursor: 'pointer', fontSize: 13, fontWeight: 600, transition: 'all 0.2s' }}>
              {tb.label}
            </button>
          ))}
        </div>
      );
    }

    function LangSwitch() {
      const { lang, setLang } = useLang();
      const opt = (id, label) => (
        <button key={id} onClick={() => setLang(id)} aria-pressed={lang === id}
          style={{ padding: '6px 14px', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 700, letterSpacing: 0.5, background: lang === id ? '#f48c06' : 'transparent', color: lang === id ? '#0a0e1a' : '#8892b0', transition: 'all 0.15s' }}>
          {label}
        </button>
      );
      return (
        <div role="group" aria-label="Language" style={{ marginLeft: 'auto', display: 'flex', borderRadius: 8, overflow: 'hidden', border: '1px solid #2a2a3a', background: '#111827' }}>
          {opt('es', 'ES')}
          {opt('en', 'EN')}
        </div>
      );
    }

    /* ─── Section: Overview ─── */

    function OverviewContent() {
      const { t } = useLang();
      const cards = [
        { title: 'FlexNet Agent (Eng. Apps)', ver: 'v5.17',
          desc: t('Se instala en cada máquina con servidor de licencias FlexNet Publisher. Comunica datos de uso al servidor FlexNet Manager for Engineering Applications.',
                  'Installed on every machine running a FlexNet Publisher license server. Reports usage data to the FlexNet Manager for Engineering Applications server.'),
          tags: [t('Licencias concurrentes', 'Concurrent licenses'), t('Uso de software', 'Software usage'), 'lmgrd/lmstat'] },
        { title: 'FlexNet Inventory Agent (FNMS)', ver: 'v17.x+',
          desc: t('Se despliega en dispositivos gestionados para recolectar inventario de hardware y software. Se comunica con Inventory Beacons que reportan al servidor central.',
                  'Deployed on managed devices to collect hardware and software inventory. Communicates with Inventory Beacons, which report to the central server.'),
          tags: [t('Inventario SW/HW', 'SW/HW inventory'), 'Discovery', 'Compliance'] },
        { title: 'Flexera Kubernetes Inv. Agent', ver: '2024+',
          desc: t('Agente específico para recolectar inventario de clústeres Kubernetes: nodos, pods, imágenes de contenedor y software dentro de ellas.',
                  'Dedicated agent that collects inventory from Kubernetes clusters: nodes, pods, container images and the software inside them.'),
          tags: ['Kubernetes', 'OCI', t('Contenedores', 'Containers')] },
      ];
      return (
        <div>
          <h2 style={{ color: '#f0f0f0', fontSize: 26, margin: '0 0 8px', fontWeight: 800 }}>{t('¿Qué son los FlexNet Agents?', 'What are FlexNet Agents?')}</h2>
          <p style={{ color: '#8892b0', fontSize: 15, lineHeight: 1.8, margin: '0 0 20px' }}>
            {t(
              <>Flexera ofrece distintos tipos de agentes según el producto y objetivo. Los dos principales son el <strong style={{ color: '#f48c06' }}>FlexNet Agent</strong> (para Engineering Applications) y el <strong style={{ color: '#f48c06' }}>FlexNet Inventory Agent</strong> (para IT Asset Management / FlexNet Manager Suite). Esta guía cubre ambos.</>,
              <>Flexera offers different types of agents depending on the product and the goal. The two main ones are the <strong style={{ color: '#f48c06' }}>FlexNet Agent</strong> (for Engineering Applications) and the <strong style={{ color: '#f48c06' }}>FlexNet Inventory Agent</strong> (for IT Asset Management / FlexNet Manager Suite). This guide covers both.</>
            )}
          </p>
          <div className="cards-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, margin: '24px 0' }}>
            {cards.map((c, i) => (
              <div key={i} style={{ background: '#111827', border: '1px solid #1e2a3a', borderRadius: 12, padding: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
                  <h3 style={{ color: '#f0f0f0', fontSize: 16, margin: 0, fontWeight: 700 }}>{c.title}</h3>
                  <Badge>{c.ver}</Badge>
                </div>
                <p style={{ color: '#8892b0', fontSize: 13, lineHeight: 1.7, margin: '0 0 14px' }}>{c.desc}</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                  {c.tags.map((tg, j) => <span key={j} style={{ fontSize: 11, padding: '3px 8px', borderRadius: 6, background: '#1a2332', color: '#6e8bb8', border: '1px solid #253347' }}>{tg}</span>)}
                </div>
              </div>
            ))}
          </div>

          <h3 style={{ color: '#f0f0f0', fontSize: 18, marginTop: 32 }}>{t('Requisitos Generales Comunes', 'Common General Requirements')}</h3>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 12 }}>
              <thead><TRow header cells={[t('Requisito', 'Requirement'), 'FlexNet Agent (Eng. Apps)', 'FlexNet Inventory Agent']} /></thead>
              <tbody>
                <TRow cells={[t('Arquitectura', 'Architecture'), t('64-bit obligatorio (Windows y Linux)', '64-bit required (Windows and Linux)'), t('64-bit recomendado', '64-bit recommended')]} />
                <TRow cells={[t('RAM mínima', 'Minimum RAM'), t('512 MB recomendado', '512 MB recommended'), t('2 GB recomendado', '2 GB recommended')]} />
                <TRow cells={[t('Puertos por defecto', 'Default ports'), t('Puerto del servidor FNMEA (ej. 443/8888)', 'FNMEA server port (e.g. 443/8888)'), t('HTTP 80 (beacon upload/download)', 'HTTP 80 (beacon upload/download)')]} />
                <TRow cells={[t('Permisos', 'Permissions'), t('Administrador local / root', 'Local administrator / root'), t('Administrador / root (servicios del sistema)', 'Administrator / root (system services)')]} />
                <TRow cells={[t('Conectividad', 'Connectivity'), t('Al servidor FlexNet Manager', 'To the FlexNet Manager server'), t('Al Inventory Beacon asignado', 'To the assigned Inventory Beacon')]} />
              </tbody>
            </table>
          </div>
          <InfoBox type="info">
            {t(
              <>Todos los instaladores se descargan desde el <strong>Flexera Product and License Center</strong> (community.flexera.com → Download Products and Licenses). Necesitas credenciales activas de Flexera Community.</>,
              <>All installers are downloaded from the <strong>Flexera Product and License Center</strong> (community.flexera.com → Download Products and Licenses). You need active Flexera Community credentials.</>
            )}
          </InfoBox>

          <h3 style={{ color: '#f0f0f0', fontSize: 18, marginTop: 32 }}>{t('Arquitectura de Comunicación', 'Communication Architecture')}</h3>
          <div className="arch-diagram" style={{ background: '#0d1117', borderRadius: 12, padding: 24, border: '1px solid #1e2a3a', margin: '12px 0', fontFamily: "'SF Mono', Consolas, monospace", fontSize: 13, color: '#c9d1d9', lineHeight: 2, textAlign: 'center' }}>
            <div style={{ color: '#f48c06', fontWeight: 700 }}>┌─────────────────────────────────────────────┐</div>
            <div style={{ color: '#f48c06', fontWeight: 700 }}>{t('│   FlexNet Manager (Servidor Central/Cloud)  │', '│   FlexNet Manager (Central Server/Cloud)    │')}</div>
            <div style={{ color: '#f48c06', fontWeight: 700 }}>└──────────────────────┬──────────────────────┘</div>
            <div style={{ color: '#555' }}>                       │ HTTPS</div>
            <div style={{ color: '#555' }}>                       ▼</div>
            <div style={{ color: '#26a269', fontWeight: 700 }}>┌──────────────────────────────────────────────┐</div>
            <div style={{ color: '#26a269', fontWeight: 700 }}>{t('│     Inventory Beacon (relay/intermediario)    │', '│     Inventory Beacon (relay/intermediary)     │')}</div>
            <div style={{ color: '#26a269', fontWeight: 700 }}>└───────┬──────────────┬───────────────┬────────┘</div>
            <div style={{ display: 'flex', justifyContent: 'center', gap: 40, marginTop: 8, flexWrap: 'wrap' }}>
              <div><div style={{ color: '#555' }}>│ HTTP/80</div><div style={{ color: '#555' }}>▼</div><div style={{ color: '#1a85ff' }}>[ Agent Win ]</div></div>
              <div><div style={{ color: '#555' }}>│ HTTP/80</div><div style={{ color: '#555' }}>▼</div><div style={{ color: '#1a85ff' }}>[ Agent Linux ]</div></div>
              <div><div style={{ color: '#555' }}>│ HTTP/80</div><div style={{ color: '#555' }}>▼</div><div style={{ color: '#1a85ff' }}>[ Agent Mac ]</div></div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Section: Windows ─── */

    function WindowsContent() {
      const { t } = useLang();
      const [sub, setSub] = useState('eng');
      return (
        <div>
          <h2 style={{ color: '#f0f0f0', fontSize: 26, margin: '0 0 16px', fontWeight: 800 }}>{t('Instalación en Windows', 'Windows Installation')}</h2>
          <SubTabs tabs={[{ id: 'eng', label: 'FlexNet Agent (Eng. Apps)' }, { id: 'inv', label: 'FlexNet Inventory Agent' }]} active={sub} onChange={setSub} />
          {sub === 'eng' ? (<div>
            <InfoBox type="info">
              {t(<>Versión más reciente: <strong>5.17</strong> (FNMEA 2025 R2). Requiere entorno de <strong>64 bits</strong> obligatorio.</>,
                 <>Latest version: <strong>5.17</strong> (FNMEA 2025 R2). A <strong>64-bit</strong> environment is required.</>)}
            </InfoBox>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Plataformas soportadas', 'Supported platforms')}</h3>
            <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
              {t('Windows Server 2016, 2019, 2022 y Windows 10/11 (64-bit). No requiere Java — usa su propio runtime InstallAnywhere.',
                 'Windows Server 2016, 2019, 2022 and Windows 10/11 (64-bit). Java is not required — it uses its own InstallAnywhere runtime.')}
            </p>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Instalación con Wizard (Interactiva)', 'Wizard Installation (Interactive)')}</h3>
            <StepCard number={1} title={t('Descargar el instalador', 'Download the installer')}>
              {t(<>Accede al <strong>Flexera Product and License Center</strong>. Descarga <code>FlexNet_Agent_5_7-All_Platforms.zip</code> (el nombre del ZIP es histórico, contiene la versión actual). Extrae el instalador .exe de Windows.</>,
                 <>Go to the <strong>Flexera Product and License Center</strong>. Download <code>FlexNet_Agent_5_7-All_Platforms.zip</code> (the ZIP name is historical; it contains the current version). Extract the Windows .exe installer.</>)}
            </StepCard>
            <StepCard number={2} title={t('Ejecutar el instalador', 'Run the installer')}>
              {t('Doble clic en el .exe. Se lanza el wizard de InstallAnywhere. Se te pedirá la URL del servidor FlexNet Manager y las credenciales.',
                 'Double-click the .exe. The InstallAnywhere wizard starts. You will be asked for the FlexNet Manager server URL and credentials.')}
            </StepCard>
            <StepCard number={3} title={t('Configurar conexión al servidor', 'Configure the server connection')}>
              {t(<>Proporciona la URL del servidor FNMEA (ej. <code>https://fnmea-server.empresa.com</code>) y el puerto configurado.</>,
                 <>Provide the FNMEA server URL (e.g. <code>https://fnmea-server.company.com</code>) and the configured port.</>)}
            </StepCard>
            <StepCard number={4} title={t('Verificar el servicio', 'Verify the service')}>
              {t(<>En <code>services.msc</code>, verifica que el servicio "FlexNet Agent" está en ejecución.</>,
                 <>In <code>services.msc</code>, check that the "FlexNet Agent" service is running.</>)}
            </StepCard>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Instalación Silenciosa', 'Silent Installation')}</h3>
            <InfoBox type="warning">
              {t(<>Debes abrir el CMD o PowerShell como <strong>Administrador</strong>. Windows requiere privilegios elevados explícitos.</>,
                 <>You must open CMD or PowerShell as <strong>Administrator</strong>. Windows requires explicitly elevated privileges.</>)}
            </InfoBox>
            <CodeBlock title={t('Instalación silenciosa', 'Silent installation')}>{t(`:: Ejecutar como Administrador
FlexNetAgent-5.17-windows-x64.exe -i silent

:: Con archivo de respuesta personalizado
FlexNetAgent-5.17-windows-x64.exe -i silent -f agent_response.properties`,
`:: Run as Administrator
FlexNetAgent-5.17-windows-x64.exe -i silent

:: With a custom response file
FlexNetAgent-5.17-windows-x64.exe -i silent -f agent_response.properties`)}</CodeBlock>
            <CodeBlock title={t('Ejemplo de archivo de respuesta', 'Response file example')}>{t(`# Configuración del servidor
FLEXNET_MANAGER_URL=https://fnmea-server.empresa.com
FLEXNET_MANAGER_PORT=443
AGENT_INSTALL_DIR=C:\\Program Files\\FlexNet Agent
REPORT_INTERVAL=60`,
`# Server configuration
FLEXNET_MANAGER_URL=https://fnmea-server.company.com
FLEXNET_MANAGER_PORT=443
AGENT_INSTALL_DIR=C:\\Program Files\\FlexNet Agent
REPORT_INTERVAL=60`)}</CodeBlock>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Gestión del Servicio', 'Service Management')}</h3>
            <CodeBlock title={t('Comandos del servicio', 'Service commands')}>{t(`sc query "FlexNet Agent"
net stop "FlexNet Agent"
net start "FlexNet Agent"

:: Desinstalar
FlexNetAgent-5.17-windows-x64.exe -i silent -r`,
`sc query "FlexNet Agent"
net stop "FlexNet Agent"
net start "FlexNet Agent"

:: Uninstall
FlexNetAgent-5.17-windows-x64.exe -i silent -r`)}</CodeBlock>
          </div>) : (<div>
            <InfoBox type="info">
              {t(<>El FlexNet Inventory Agent se comunica con un <strong>Inventory Beacon</strong> intermedio para reportar al servidor central.</>,
                 <>The FlexNet Inventory Agent communicates with an intermediate <strong>Inventory Beacon</strong> to report to the central server.</>)}
            </InfoBox>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Métodos de despliegue', 'Deployment methods')}</h3>
            <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
              {t(<><strong>Adopción automática</strong> (el beacon descubre y despliega) o <strong>Despliegue con herramienta de terceros</strong> (SCCM, GPO, etc.).</>,
                 <><strong>Automatic adoption</strong> (the beacon discovers and deploys) or <strong>deployment with a third-party tool</strong> (SCCM, GPO, etc.).</>)}
            </p>
            <StepCard number={1} title={t('Obtener el paquete MSI', 'Get the MSI package')}>
              {t(<>Desde la consola web: <strong>Discovery &amp; Inventory → Settings → Inventory agent for download</strong>.</>,
                 <>From the web console: <strong>Discovery &amp; Inventory → Settings → Inventory agent for download</strong>.</>)}
            </StepCard>
            <StepCard number={2} title={t('Preparar el archivo bootstrap', 'Prepare the bootstrap file')}>
              {t(<>Descarga y edita <code>mgssetup.ini</code> con la URL de tu beacon.</>,
                 <>Download and edit <code>mgssetup.ini</code> with your beacon URL.</>)}
            </StepCard>
            <CodeBlock title={t('Ejemplo mgssetup.ini', 'mgssetup.ini example')}>{t(`[ManageSoft]
MGSFT_BOOTSTRAP_DOWNLOAD=http://beacon.empresa.com/ManageSoftDL
MGSFT_BOOTSTRAP_UPLOAD=http://beacon.empresa.com/ManageSoftRL
MGSFT_RUNPOLICY=1`,
`[ManageSoft]
MGSFT_BOOTSTRAP_DOWNLOAD=http://beacon.company.com/ManageSoftDL
MGSFT_BOOTSTRAP_UPLOAD=http://beacon.company.com/ManageSoftRL
MGSFT_RUNPOLICY=1`)}</CodeBlock>
            <StepCard number={3} title={t('Instalar con msiexec', 'Install with msiexec')}>{t('Instalación silenciosa:', 'Silent installation:')}</StepCard>

          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t(<>Archivo principal en <code>/var/opt/managesoft/etc/config.ini</code>. No editarlo directamente — usar <code>mgsconfig</code>:</>,
               <>Main file at <code>/var/opt/managesoft/etc/config.ini</code>. Do not edit it directly — use <code>mgsconfig</code>:</>)}
          </p>
          <CodeBlock title={t('Actualizar config parcialmente', 'Partially update the config')}>{`cat > /var/tmp/patch.ini << 'EOF'
[ManageSoft\\Launcher\\CurrentVersion]
NetworkSense=False
EOF

/opt/managesoft/bin/mgsconfig -i /var/tmp/patch.ini`}</CodeBlock>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Configuración en Windows', 'Configuration on Windows')}</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t('En Windows se almacena en el Registro. Se configura vía: parámetros MSI, transforms (.mst), bootstrap (mgssetup.ini), o políticas del beacon.',
               'On Windows it is stored in the Registry. It is configured via: MSI parameters, transforms (.mst), bootstrap (mgssetup.ini), or beacon policies.')}
          </p>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Auto-actualización', 'Auto-update')}</h3>
          <InfoBox type="info">
            {t(<>En <strong>Inventory Settings → Version to deploy</strong> defines la versión objetivo. Agentes controlados por política se actualizan automáticamente.</>,
               <>In <strong>Inventory Settings → Version to deploy</strong> you define the target version. Policy-managed agents update automatically.</>)}
          </InfoBox>
          <InfoBox type="warning">
            {t(<><strong>Limitación UNIX:</strong> Agentes instalados en modo "least privilege" en UNIX <strong>no pueden auto-actualizarse</strong>. Usa actualización manual o herramienta de terceros.</>,
               <><strong>UNIX limitation:</strong> Agents installed in "least privilege" mode on UNIX <strong>cannot auto-update</strong>. Use a manual update or a third-party tool.</>)}
          </InfoBox>
        </div>
      );
    }

    /* ─── Section: Troubleshooting ─── */

    function TroubleshootingContent() {
      const { t } = useLang();
      const faqs = [
        { q: t('El agente no se comunica con el Inventory Beacon', 'The agent does not communicate with the Inventory Beacon'),
          a: t('Verifica conectividad (telnet/curl al puerto 80/443). Comprueba URLs en mgsft_rollout_response (UNIX) o mgssetup.ini (Windows). Revisa policy.log y uploader.log. Verifica firewall/proxy.',
               'Check connectivity (telnet/curl to port 80/443). Verify the URLs in mgsft_rollout_response (UNIX) or mgssetup.ini (Windows). Review policy.log and uploader.log. Check the firewall/proxy.') },
        { q: t('Instalación silenciosa en Windows falla', 'Silent installation on Windows fails'),
          a: t('Asegúrate de ejecutar como Administrador real (cmd elevado). Verifica sintaxis de msiexec (sin espacios extra después de /v"). Revisa log con /l*v.',
               'Make sure you run as a real Administrator (elevated cmd). Check the msiexec syntax (no extra spaces after /v"). Review the log with /l*v.') },
        { q: t('Popup de Java en macOS', 'Java popup on macOS'),
          a: t('Problema conocido con Java viejo en /System/Library/Frameworks/JavaVM.framework. Excluir directorio del file scanning en Inventory Settings.',
               'Known issue with old Java in /System/Library/Frameworks/JavaVM.framework. Exclude the directory from file scanning in Inventory Settings.') },
        { q: t('Servicios no inician en Linux', 'Services do not start on Linux'),
          a: t('Verifica que mgsft_rollout_response existía en /var/tmp/ ANTES de instalar. Revisa /var/opt/managesoft/log/installation.log. Verificar instalación con sudo/root.',
               'Verify that mgsft_rollout_response existed in /var/tmp/ BEFORE installing. Review /var/opt/managesoft/log/installation.log. Verify the installation was done with sudo/root.') },
        { q: t('Inventario Docker no aparece', 'Docker inventory does not appear'),
          a: t('Verificar "Enable Docker inventory" en Inventory Settings → Container scanning. Esperar 24-48h. El agente debe estar en el HOST, no dentro del contenedor.',
               'Check "Enable Docker inventory" in Inventory Settings → Container scanning. Wait 24-48h. The agent must be on the HOST, not inside the container.') },
        { q: t('Kubernetes Agent no reporta', 'Kubernetes Agent does not report'),
          a: t('Verificar pod corriendo (kubectl get pods). Comprobar URL del beacon en YAML. Revisar logs del pod. Solo una instancia por clúster.',
               'Check that the pod is running (kubectl get pods). Verify the beacon URL in the YAML. Review the pod logs. Only one instance per cluster.') },
        { q: t('Problemas HTTPS en UNIX/macOS', 'HTTPS issues on UNIX/macOS'),
          a: t('UNIX requiere configuración manual de certificados CA (Windows lo hace automáticamente). Si no puedes resolverlo, usa HTTP para bootstrap.',
               'UNIX requires manual CA certificate configuration (Windows does it automatically). If you cannot resolve it, use HTTP for the bootstrap.') },
      ];
      return (
        <div>
          <h2 style={{ color: '#f0f0f0', fontSize: 26, margin: '0 0 16px', fontWeight: 800 }}>{t('Solución de Problemas', 'Troubleshooting')}</h2>
          {faqs.map((f, i) => (
            <details key={i} style={{ margin: '8px 0', border: '1px solid #1e2a3a', borderRadius: 8, overflow: 'hidden' }}>
              <summary style={{ padding: '14px 18px', cursor: 'pointer', background: '#111827', color: '#e0e0e0', fontWeight: 600, fontSize: 14 }}>
                <span className="arrow" style={{ color: '#f48c06', marginRight: 8, display: 'inline-block', transition: 'transform 0.2s' }}>▸</span>{f.q}
              </summary>
              <div style={{ padding: '14px 18px', background: '#0d1117', color: '#8892b0', fontSize: 14, lineHeight: 1.7, borderTop: '1px solid #1e2a3a' }}>{f.a}</div>
            </details>
          ))}
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 32 }}>{t('Ubicaciones de logs', 'Log locations')}</h3>
          <div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 8 }}>
            <thead><TRow header cells={[t('Plataforma', 'Platform'), t('Ubicación', 'Location')]} /></thead>
            <tbody>
              <TRow cells={['Windows', '%ProgramData%\\ManageSoft\\log\\']} />
              <TRow cells={['Linux / macOS', '/var/opt/managesoft/log/']} />
              <TRow cells={[t('Linux (zero-touch, root)', 'Linux (zero-touch, root)'), '/var/tmp/flexera/log/']} />
              <TRow cells={['Kubernetes Agent', 'kubectl logs <pod-name>']} />
            </tbody>
          </table></div>
          <InfoBox type="info">
            {t(<>Monitorea versiones de agentes en la consola web: <strong>Discovery &amp; Inventory → FlexNet Inventory Agent Status</strong>.</>,
               <>Monitor agent versions in the web console: <strong>Discovery &amp; Inventory → FlexNet Inventory Agent Status</strong>.</>)}
          </InfoBox>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Documentación Oficial', 'Official Documentation')}</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 2 }}>
            {t(<>
              • <strong>docs.flexera.com</strong> — Documentación oficial de todos los productos Flexera<br/>
              • <strong>community.flexera.com</strong> — Foros y Knowledge Base<br/>
              • FlexNet Agent Installation Guide — docs.flexera.com/fnmea/<br/>
              • FlexNet Inventory Agent &amp; Managed Devices — PDF en la documentación de FNMS
            </>, <>
              • <strong>docs.flexera.com</strong> — Official documentation for all Flexera products<br/>
              • <strong>community.flexera.com</strong> — Forums and Knowledge Base<br/>
              • FlexNet Agent Installation Guide — docs.flexera.com/fnmea/<br/>
              • FlexNet Inventory Agent &amp; Managed Devices — PDF in the FNMS documentation
            </>)}
          </p>
          <InfoBox type="danger">
            {t(<>Guía basada en documentación pública de Flexera. Las versiones y comportamientos pueden cambiar. <strong>Consulta siempre la documentación oficial de tu versión específica.</strong></>,
               <>Guide based on Flexera's public documentation. Versions and behavior may change. <strong>Always consult the official documentation for your specific version.</strong></>)}
          </InfoBox>
        </div>
      );
    }

    /* ─── Main App ─── */

    const CONTENT = {
      overview: OverviewContent,
      windows: WindowsContent,
      linux: LinuxContent,
      mac: MacContent,
      containers: ContainersContent,
      config: ConfigContent,
      troubleshooting: TroubleshootingContent,
    };

    function App() {
      const [lang, setLangState] = useState(detectLang);
      const [active, setActive] = useState('overview');

      const setLang = useCallback((l) => {
        setLangState(l);
        try { window.localStorage.setItem('flexera-guide-lang', l); } catch (e) {}
      }, []);
      const t = useCallback((es, en) => (lang === 'es' ? es : en), [lang]);

      useEffect(() => {
        document.documentElement.lang = lang;
        document.title = META[lang].title;
        const m = document.querySelector('meta[name="description"]');
        if (m) m.setAttribute('content', META[lang].description);
      }, [lang]);

      const SECTIONS = [
        { id: 'overview', title: t('Visión General', 'Overview'), icon: '📋' },
        { id: 'windows',  title: 'Windows',                        icon: '🪟' },
        { id: 'linux',    title: 'Linux',                          icon: '🐧' },
        { id: 'mac',      title: 'macOS',                          icon: '🍎' },
        { id: 'containers', title: t('Contenedores', 'Containers'), icon: '📦' },
        { id: 'config',   title: t('Configuración', 'Configuration'), icon: '⚙️' },
        { id: 'troubleshooting', title: t('Problemas', 'Troubleshooting'), icon: '🔧' },
      ];
      const Content = CONTENT[active];

      return (
        <LangContext.Provider value={{ lang, setLang, t }}>
          <div style={{ minHeight: '100vh', background: '#0a0e1a', color: '#e0e0e0', fontFamily: "'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" }}>
            {/* Header */}
            <div style={{ background: 'linear-gradient(135deg, #0d1117 0%, #1a1428 50%, #0d1117 100%)', borderBottom: '1px solid #1e2a3a', padding: '24px 0' }}>
              <div style={{ maxWidth: 1100, margin: '0 auto', padding: '0 24px', display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
                <div style={{ width: 48, height: 48, borderRadius: 12, background: 'linear-gradient(135deg, #e85d04, #f48c06)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, flexShrink: 0 }}>🛡️</div>
                <div>
                  <h1 className="header-title" style={{ margin: 0, fontSize: 24, fontWeight: 800, color: '#f0f0f0', letterSpacing: -0.5 }}>
                    FlexNet Agents <span style={{ color: '#f48c06' }}>{t('— Guía Completa', '— Complete Guide')}</span>
                  </h1>
                  <p style={{ margin: '4px 0 0', fontSize: 13, color: '#6e7b91' }}>
                    {t('Flexera · Instalación · Configuración · Windows · Linux · macOS · Contenedores',
                       'Flexera · Installation · Configuration · Windows · Linux · macOS · Containers')}
                  </p>
                </div>
                <LangSwitch />
              </div>
            </div>

            {/* Layout */}
            <div className="layout" style={{ maxWidth: 1100, margin: '0 auto', padding: 24, display: 'flex', gap: 24, alignItems: 'flex-start' }}>
              {/* Sidebar */}
              <nav className="sidebar" style={{ minWidth: 210, position: 'sticky', top: 24, flexShrink: 0 }}>
                <div className="sidebar-inner" style={{ background: '#111827', border: '1px solid #1e2a3a', borderRadius: 12, padding: 8 }}>
                  {SECTIONS.map(s => (
                    <button key={s.id} onClick={() => { setActive(s.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '11px 14px', border: 'none', borderRadius: 8, background: active === s.id ? '#f48c0618' : 'transparent', color: active === s.id ? '#f48c06' : '#8892b0', cursor: 'pointer', fontSize: 14, fontWeight: active === s.id ? 700 : 500, textAlign: 'left', transition: 'all 0.15s', borderLeft: active === s.id ? '3px solid #f48c06' : '3px solid transparent' }}>
                      <span className="icon" style={{ fontSize: 18 }}>{s.icon}</span>{s.title}
                    </button>
                  ))}
                </div>
                <div className="sources-box" style={{ marginTop: 16, padding: 14, background: '#111827', border: '1px solid #1e2a3a', borderRadius: 12, fontSize: 11, color: '#555c70', lineHeight: 1.6 }}>
                  <strong style={{ color: '#6e7b91' }}>{t('Fuentes:', 'Sources:')}</strong><br/>docs.flexera.com<br/>community.flexera.com<br/>Docs FNMEA 2025 R1/R2<br/>FNMS 2025 R1 docs
                </div>
              </nav>

              {/* Content */}
              <main className="main-content" style={{ flex: 1, minWidth: 0, background: '#111827', border: '1px solid #1e2a3a', borderRadius: 12, padding: '28px 32px' }}>
                <Content />
              </main>
            </div>

            {/* Footer */}
            <div style={{ borderTop: '1px solid #1e2a3a', padding: '20px 24px', textAlign: 'center', fontSize: 12, color: '#3d4555', marginTop: 40 }}>
              {t('Guía basada en documentación pública de Flexera (docs.flexera.com). No es documentación oficial. Consulta siempre la documentación de tu versión específica.',
                 'Guide based on Flexera\'s public documentation (docs.flexera.com). It is not official documentation. Always consult the documentation for your specific version.')}
            </div>
          </div>
        </LangContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
