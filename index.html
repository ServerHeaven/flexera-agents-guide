  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useEffect, useContext, createContext } = React;

    /* ─── i18n ─── */

    const META = {
      es: {
        title: 'Flexera One — Agentes de inventario: instalación, configuración y compatibilidad',
        description: 'Guía de instalación, configuración, actualización y matrices de compatibilidad de los agentes de Flexera One (FlexNet Inventory Agent, Kubernetes, Beacon) para Windows, Linux, UNIX, macOS y contenedores.',
      },
      en: {
        title: 'Flexera One — Inventory agents: installation, configuration and compatibility',
        description: 'Installation, configuration, upgrade guide and compatibility matrices for Flexera One agents (FlexNet Inventory Agent, Kubernetes, Beacon) on Windows, Linux, UNIX, macOS and containers.',
      },
    };

    function detectLang() {
      try {
        const q = new URLSearchParams(window.location.search).get('lang');
        if (q === 'es' || q === 'en') return q;
      } catch (e) {}
      try {
        const saved = window.localStorage.getItem('flexera-guide-lang');
        if (saved === 'es' || saved === 'en') return saved;
      } catch (e) {}
      const nav = (navigator.language || 'es').toLowerCase();
      return nav.startsWith('es') ? 'es' : 'en';
    }

    const LangContext = createContext({ lang: 'es', t: (es) => es });
    const useLang = () => useContext(LangContext);

    /* ─── Utility Components ─── */

    function CodeBlock({ children, title }) {
      const { t } = useLang();
      const [copied, setCopied] = useState(false);
      const handleCopy = useCallback(() => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(children);
        } else {
          const ta = document.createElement('textarea');
          ta.value = children;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }, [children]);

      return (
        <div style={{ margin: '16px 0', borderRadius: 8, overflow: 'hidden', border: '1px solid #2a2a3a' }}>
          {title && (
            <div style={{ background: '#1a1a2e', padding: '8px 16px', fontSize: 12, color: '#8892b0', fontFamily: "'SF Mono', Consolas, monospace", display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
              <span>{title}</span>
              <button onClick={handleCopy} style={{ background: 'none', border: '1px solid #333', color: copied ? '#26a269' : '#8892b0', padding: '2px 10px', borderRadius: 4, cursor: 'pointer', fontSize: 11, transition: 'color 0.2s' }}>
                {copied ? t('✓ Copiado', '✓ Copied') : t('Copiar', 'Copy')}
              </button>
            </div>
          )}
          <pre style={{ background: '#0d1117', padding: 16, margin: 0, overflowX: 'auto', fontSize: 13, lineHeight: 1.6, color: '#c9d1d9', fontFamily: "'SF Mono', Consolas, monospace" }}>
            <code>{children}</code>
          </pre>
        </div>
      );
    }

    function InfoBox({ type = 'info', children }) {
      const { t } = useLang();
      const styles = {
        info:    { bg: '#0d2847', border: '#1a5fb4', icon: 'ℹ️', label: t('Información', 'Information') },
        warning: { bg: '#3d2e00', border: '#c4a000', icon: '⚠️', label: t('Advertencia', 'Warning') },
        danger:  { bg: '#3d0000', border: '#c01c28', icon: '🚨', label: t('Importante', 'Important') },
        tip:     { bg: '#0d3324', border: '#26a269', icon: '💡', label: t('Consejo', 'Tip') },
      };
      const s = styles[type];
      return (
        <div style={{ margin: '16px 0', padding: '14px 18px', borderRadius: 8, background: s.bg, borderLeft: '4px solid ' + s.border, fontSize: 14, lineHeight: 1.7, color: '#e0e0e0' }}>
          <strong style={{ color: s.border }}>{s.icon} {s.label}:</strong>{' '}
          {children}
        </div>
      );
    }

    function StepCard({ number, title, children }) {
      return (
        <div style={{ display: 'flex', gap: 16, margin: '20px 0' }}>
          <div style={{ minWidth: 38, height: 38, borderRadius: '50%', background: 'linear-gradient(135deg, #e85d04, #f48c06)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 16, color: '#fff', flexShrink: 0, marginTop: 2 }}>
            {number}
          </div>
          <div style={{ flex: 1 }}>
            <h4 style={{ margin: '0 0 8px', fontSize: 16, color: '#f0f0f0', fontWeight: 700 }}>{title}</h4>
            <div style={{ color: '#b0b8c8', lineHeight: 1.75, fontSize: 14 }}>{children}</div>
          </div>
        </div>
      );
    }

    function Badge({ children, color = '#e85d04' }) {
      return (
        <span style={{ display: 'inline-block', background: color + '22', color, padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', border: '1px solid ' + color + '44' }}>
          {children}
        </span>
      );
    }

    function TRow({ cells, header }) {
      const Tag = header ? 'th' : 'td';
      return (
        <tr>
          {cells.map((c, i) => (
            <Tag key={i} style={{ padding: '10px 14px', borderBottom: '1px solid #1e2a3a', textAlign: 'left', fontSize: 13, color: header ? '#f48c06' : '#c0c8d8', fontWeight: header ? 700 : 400, background: header ? '#0d1117' : 'transparent' }}>{c}</Tag>
          ))}
        </tr>
      );
    }

    function SubTabs({ tabs, active, onChange }) {
      return (
        <div style={{ display: 'flex', gap: 8, marginBottom: 24, flexWrap: 'wrap' }}>
          {tabs.map(tb => (
            <button key={tb.id} onClick={() => onChange(tb.id)} style={{ padding: '8px 18px', borderRadius: 8, border: active === tb.id ? '1px solid #f48c06' : '1px solid #1e2a3a', background: active === tb.id ? '#f48c0618' : '#111827', color: active === tb.id ? '#f48c06' : '#8892b0', cursor: 'pointer', fontSize: 13, fontWeight: 600, transition: 'all 0.2s' }}>
              {tb.label}
            </button>
          ))}
        </div>
      );
    }

    /* ─── Layout helpers (added for the Flexera One edition) ─── */

    const H2 = ({ children }) => <h2 style={{ color: '#f0f0f0', fontSize: 26, margin: '0 0 16px', fontWeight: 800 }}>{children}</h2>;
    const H3 = ({ children }) => <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{children}</h3>;
    const P = ({ children }) => <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7, margin: '8px 0 0' }}>{children}</p>;
    const Note = ({ children }) => <p style={{ color: '#6e7b91', fontSize: 12, lineHeight: 1.6, margin: '8px 0 0' }}>{children}</p>;

    function Tbl({ head, rows }) {
      return (
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 12 }}>
            <thead><TRow header cells={head} /></thead>
            <tbody>{rows.map((r, i) => <TRow key={i} cells={r} />)}</tbody>
          </table>
        </div>
      );
    }

    function Card({ title, ver, desc, tags, color }) {
      return (
        <div style={{ background: '#111827', border: '1px solid #1e2a3a', borderRadius: 12, padding: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
            <h3 style={{ color: '#f0f0f0', fontSize: 16, margin: 0, fontWeight: 700 }}>{title}</h3>
            {ver && <Badge color={color}>{ver}</Badge>}
          </div>
          <p style={{ color: '#8892b0', fontSize: 13, lineHeight: 1.7, margin: '0 0 14px' }}>{desc}</p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {tags.map((tg, j) => <span key={j} style={{ fontSize: 11, padding: '3px 8px', borderRadius: 6, background: '#1a2332', color: '#6e8bb8', border: '1px solid #253347' }}>{tg}</span>)}
          </div>
        </div>
      );
    }

    const OnPrem = () => <Badge color="#6e8bb8">On-prem (FNMS)</Badge>;

    /* ─── Official Flexera documentation links (all URLs verified against docs.flexera.com) ─── */

    const ITAMR = 'https://docs.flexera.com/itam-releases';
    const ITAMD = 'https://docs.flexera.com/itam-discovery/gathering-flexnet-inventory';

      home:           'https://docs.flexera.com/',
      community:      'https://community.flexera.com/',
      plc:            'https://flexerasoftware.flexnetoperations.com',
      fiaSysReqs:     GATHER + '/topics/FIA-SystemReqs.html',

      fa3Impl:        'https://docs.flexera.com/FlexNetManagerSuite2025R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/FA3-ImplemIntro.html',
      fa3CustomUnix:  'https://docs.flexera.com/FlexNetManagerSuite2024R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/FA3-CustomForUNIX.html',
      fa3InstallUnix: GATHER + '/tasks/FA3-InstallUNIX.html',
      fa3SetupIni:    GATHER + '/tasks/FA3-CustomSetupIni.html',
      fa3Sample:      'https://docs.flexera.com/fnms/EN/GatherFNInv/index.html#SysRef/FlexNetInventoryAgent/topics/FA3-SampleBootstrap.html',
      fiaTrouble:     GATHER + '/tasks/FIA-Troubleshooting.html',
      fa3Trouble:     'https://docs.flexera.com/FlexNetManagerSuite2024R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/tasks/FA3-Troubleshooting.html',
      fisTrouble:     GATHER + '/tasks/FIS-Troubleshooting.html',
      zfaTrouble:     'https://docs.flexera.com/FlexNetManagerSuite2024R2/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/tasks/ZFA-Troubleshooting.html',
      logFile:        GATHER + '/topics/PMD-LogFile.html',
      commandLines:   GATHER + '/topics/CommandLinesIntro.html',
      flxconfig:      GATHER + '/reference/flxconfig-CommandLine.html',
      flxconfigNews:  'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/RN-new-flxconfig.htm',
      httpProxy:      GATHER + '/topics/PMD-HTTP_Proxy.html',
      httpsProxy:     'https://docs.flexera.com/fnms/EN/GatherFNInv/index.html#SysRef/FlexNetInventoryAgent/topics/PMD-HTTPS_Proxy.html',

      versionSpec:    'https://docs.flexera.com/FlexNetManagerSuite2025R1/EN/WebHelp/tasks/FIA-VersionSpec.html',
      changelog:      ITAMR + '/flexnet-inventory-agent-change-log',
      networkReqs:    'https://docs.flexera.com/fnms/EN/SysReq/FNMS_sys_req/RN_sys_req_network.html',
      portsKb:        'https://community.flexera.com/t5/FlexNet-Manager-Knowledge-Base/Ports-Required-by-the-FlexNet-Manager-Suite-Core-Compliance/ta-p/5805',
      logsKb:         'https://community.flexera.com/s/article/flexnet-manager-suite-log-files-and-locations',
      fnmeaAgent:     'https://docs.flexera.com/fnmea/AgentInstallationGuide/Content/helplibrary/Introduction_and_Overview.htm',
      fnmeaWizard:    'https://docs.flexera.com/fnmea/2020r1/AgentInstallationGuide/Content/helplibrary/Installing_Using_the_InstallAnywhere_Installation_Wizard_on_Microsoft_Windo.htm',
      fnmeaInstall:   'https://docs.flexera.com/fnmea/InstallationGuide/Content/helplibrary/_Installation_Guide_.htm',
      fnmeaConcept:   'https://docs.flexera.com/fnmea/ConceptGuide/Content/helplibrary/fnmc_02_overview.htm',
      k8sTwo:         K8S + '/topics/TwoKAgentsIntro.html',
      k8sDownload:    'https://docs.flexera.com/fnms/EN/WebHelp/tasks/InvSet-KubAgentDownload.html',
      k8sExamples:    'https://docs.flexera.com/fnms/EN/WebHelp/topics/InvSet-KRMExamples.html',
      k8sFeatures:    'https://docs.flexera.com/fnms/EN/WebHelp/topics/InvSet-KubAgentFeatures.html',
      k8sPermissions: 'https://docs.flexera.com/FlexNetManagerSuite2025R2/EN/GatherFNInv/SysRef/KubernetesAgents/topics/PermissionsOverview.html',
      lwkDownload:    K8S + '/tasks/lwk-Download.html',
      lwkScripted:    K8S + '/tasks/lwk-ScriptedInstall.html',
      lwkManual:      K8S + '/tasks/lwk-ManualInstall.html',
      lwkHelm:        K8S + '/topics/lwk-ValuesConfigOptions.html',
      helmNews:       'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/RN-new-HelmCharts.htm',
      krmChart:       'https://gallery.ecr.aws/flexera/krm-chart',
      lwkChart:       'https://gallery.ecr.aws/flexera/lwk-chart',
      k8sUninstall:   'https://docs.flexera.com/flexera/EN/ITAssets/InvSet-Uninstall.htm',
      installersNews: 'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/2024FEB-ITV-Kubernetes-Agent-FLEX-1007.htm',
      containerMon:   'https://docs.flexera.com/flexera/EN/ITAssets/flexera-container-monitor.htm',
      /* Flexera One (ITAM Release Notes / IT Visibility) */
      osSupport:      ITAMR + '/system-req/agent-operating-systems',
      prereqSw:       ITAMR + '/system-req/prerequisite-software',
      compat:         ITAMR + '/system-req/compatibility',
      netReqs:        ITAMR + '/system-req/network-requirements',
      hwReqs:         ITAMR + '/system-req/hardware-requirements',
      agentLog:       ITAMR + '/flexnet-inventory-agent-change-log',
      beaconLog:      ITAMR + '/inventory-beacon-change-log',
      itvAgentLog:    F1B + '/flexnet-inventory-agent-change-log-for-it-visibility',
      itvPrereq:      F1B + '/prerequisites-for-it-visibility-inventory-beacons-and-agents',
      beaconDownload: F1B + '/downloading-and-installing-the-flexnet-beacon-software',
      beaconCreate:   F1B + '/creating-an-inventory-beacon-to-upload-inventory-to-flexera-one',
      manualDownload: F1B + '/configuring-an-inventory-agent/deploying-an-inventory-agent/customizing-an-inventory-agent-configuration/editing-inventory-agent-options/manual-inventory-agent-download',
      autoDeploy:     'https://docs.flexera.com/flexera-one/it-assets/discovery/inv-set-page-intro/inv-set-agent-inv-auto-deploy/',
      beaconPrereqItam: 'https://docs.flexera.com/flexera-one/it-assets/inventory-beacon/prerequisites-for-inventory-beacons',
      itvDeploy:      'https://docs.flexera.com/flexera/EN/Beacons/DeployAgent.htm',
      itvAutoDeploy:  'https://docs.flexera.com/flexera/EN/Beacons/InvSet-AgentInvAutoDeploy.htm',
      itvCautions:    'https://docs.flexera.com/flexera/EN/Beacons/InvSet-InvAgentVerCautions.htm',
      installBeaconItam: 'https://docs.flexera.com/flexera/EN/ITAssets/InstallingInventoryBeacon.htm',
      bootstrapNews:  'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/ITVJune2024-bootstrap.htm',
      k8sAgents:      ITAMD + '/k8s-agents',
      fiaWhatToUse:   GATHER + '/topics/FIA-WhatToUse.html',
      fiaDeployment:  GATHER + '/topics/FIA-Deployment.html',
      zfaImpl:        GATHER + '/tasks/ZFA-Implentation.html',
      zfaAccounts:    GATHER + '/topics/ZFA-AccountsPrivileges.html',
      fisCommandLine: GATHER + '/reference/FIS-CommandLine.html',
      fa3Https:       GATHER + '/topics/FA3-EnablingHTTPS.html',
      snow:           'https://docs.flexera.com/snow-inventory-agents/',
      eol:            'https://docs.flexera.com/eol/',
      relNotes:       'https://docs.flexera.com/release-notes/',
    };

    function Ext({ href, children }) {
      return <a className="doc-link" href={href} target="_blank" rel="noopener noreferrer" style={{ color: '#1a85ff', textDecoration: 'none' }}>{children} ↗</a>;
    }

    function DocLinks({ links }) {
      const { t } = useLang();
      return (
        <div style={{ margin: '28px 0 8px', padding: '14px 18px', borderRadius: 8, background: '#0d1117', border: '1px solid #1e2a3a' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: '#f48c06', marginBottom: 8 }}>📖 {t('Documentación oficial de Flexera', 'Official Flexera documentation')}</div>
          <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 6 }}>
            {links.map((l, i) => (
              <li key={i} style={{ fontSize: 13, lineHeight: 1.6 }}>
                <Ext href={l.url}>{l.label}</Ext>
                {l.note && <span style={{ color: '#6e7b91' }}> — {l.note}</span>}
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LangSwitch() {
      const { lang, setLang } = useLang();
      const opt = (id, label) => (
        <button key={id} onClick={() => setLang(id)} aria-pressed={lang === id}
          style={{ padding: '6px 14px', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 700, letterSpacing: 0.5, background: lang === id ? '#f48c06' : 'transparent', color: lang === id ? '#0a0e1a' : '#8892b0', transition: 'all 0.15s' }}>
          {label}
        </button>
      );
      return (
        <div role="group" aria-label="Language" style={{ marginLeft: 'auto', display: 'flex', borderRadius: 8, overflow: 'hidden', border: '1px solid #2a2a3a', background: '#111827' }}>
          {opt('es', 'ES')}
          {opt('en', 'EN')}
        </div>
      );
    }

    /* ─── Section: Overview ─── */

    function OverviewContent() {
      const { t } = useLang();
      return (
        <div>
          <H2>{t('Agentes y componentes de recolección de Flexera One', 'Flexera One agents and collection components')}</H2>
          <p style={{ color: '#8892b0', fontSize: 15, lineHeight: 1.8, margin: '0 0 12px' }}>

              <><strong style={{ color: '#f48c06' }}>Flexera One</strong> collects inventory with the same set of components in both of its data products, <strong>IT Asset Management (ITAM)</strong> and <strong>IT Visibility (ITV)</strong>: the <strong>FlexNet Inventory Agent</strong> on each device, the <strong>Kubernetes agents</strong> in clusters and the <strong>Inventory Beacon</strong> as the relay to the cloud. This guide covers their installation, configuration, upgrade and compatibility.</>
            )}
          </p>
          <InfoBox type="info">
            {t(<>Versión de referencia: <strong>Flexera One ITAM 2026 R2 = agente y beacon 27.0.0</strong> (documentación consultada el 11-nov-2026). Desde 2026 la numeración sube por semestre: 26.x = 2026 R1 y 27.0.0 = 2026 R2. Las diferencias de <strong>FlexNet Manager Suite (On-Premises)</strong> se marcan con la etiqueta <OnPrem /> o en la tabla del final de esta sección.</>,
               <>Reference version: <strong>Flexera One ITAM 2026 R2 = agent and beacon 27.0.0</strong> (documentation read on 11 Nov 2026). Since 2026 the major number increases per half-year: 26.x = 2026 R1 and 27.0.0 = 2026 R2. Differences for <strong>FlexNet Manager Suite (On-Premises)</strong> are flagged with the <OnPrem /> label or in the table at the end of this section.</>)}
          </InfoBox>

          <H3>{t('Catálogo de componentes', 'Component catalog')}</H3>
          <div className="cards-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, margin: '16px 0' }}>

              { label: 'Flexera Product and License Center', url: DOC.plc, note: t('Descarga de instaladores', 'Installer downloads') },
            ]} />
          </div>) : (<div>
            <InfoBox type="info">
              {t(<>El FlexNet Inventory Agent se comunica con un <strong>Inventory Beacon</strong> que reenvía el inventario a Flexera One. SO soportados: Windows 10/11 y Server 2016–2025 (x64; ARM en 10/11/2025). Consulta la sección <strong>Matrices</strong> para versiones y la sección <strong>Actualización</strong> para el ciclo de vida.</>,
                 <>The FlexNet Inventory Agent communicates with an <strong>Inventory Beacon</strong> that forwards inventory to Flexera One. Supported OSes: Windows 10/11 and Server 2016–2025 (x64; ARM on 10/11/2025). See the <strong>Matrices</strong> section for versions and the <strong>Upgrades</strong> section for the lifecycle.</>)}
            </InfoBox>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Métodos de despliegue', 'Deployment methods')}</h3>
            <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
              {t(<><strong>Adopción automática</strong> (el beacon descubre y despliega por SMB 445/NetBIOS 139) o <strong>despliegue con herramienta de terceros</strong> (GPO, SCCM/MECM, Intune…; ver Matriz 4). La documentación de abajo describe el segundo caso.</>,
                 <><strong>Automatic adoption</strong> (the beacon discovers and deploys over SMB 445/NetBIOS 139) or <strong>deployment with a third-party tool</strong> (GPO, SCCM/MECM, Intune…; see Matrix 4). The steps below describe the second case.</>)}
            </p>
            <StepCard number={1} title={t('Obtener el paquete MSI', 'Get the MSI package')}>
              {t(<>Flexera One ITAM: <strong>Data Collection → IT Assets Inventory Tasks → Inventory Settings → «Inventory agent for download»</strong> (en Windows, «FlexNet Inventory Agent»). El zip contiene <code>FlexNet Inventory Agent.msi</code> y <code>Setup.ini</code>; la plantilla <code>mgssetup.ini</code> se descarga también desde ahí. IT Visibility: página <strong>Installers</strong>. <OnPrem />: Discovery &amp; Inventory → Settings.</>,
                 <>Flexera One ITAM: <strong>Data Collection → IT Assets Inventory Tasks → Inventory Settings → &quot;Inventory agent for download&quot;</strong> (on Windows, &quot;FlexNet Inventory Agent&quot;). The zip contains <code>FlexNet Inventory Agent.msi</code> and <code>Setup.ini</code>; the <code>mgssetup.ini</code> template is also downloaded from there. IT Visibility: <strong>Installers</strong> page. <OnPrem />: Discovery &amp; Inventory → Settings.</>)}
            </StepCard>
            <StepCard number={2} title={t('Preparar el archivo bootstrap', 'Prepare the bootstrap file')}>
              {t(<>Descarga y edita <code>mgssetup.ini</code> en un editor de texto plano (sin caracteres no ASCII; las líneas que empiezan por <code>;</code> son comentarios). Los ajustes clave son <code>INSTALLMACHINEPOLICY</code> (descomentar y activar) y la URL del beacon (<code>DEPLOYSERVERURL</code>) en la sección <code>[Custom Install Settings]</code>. El fichero debe estar en la misma carpeta que el MSI y ser legible por SYSTEM y por el usuario instalador (no una unidad mapeada).</>,
                 <>Download and edit <code>mgssetup.ini</code> in a plain-text editor (no non-ASCII characters; lines starting with <code>;</code> are comments). The key settings are <code>INSTALLMACHINEPOLICY</code> (uncomment and enable) and the beacon URL (<code>DEPLOYSERVERURL</code>) in the <code>[Custom Install Settings]</code> section. The file must sit in the same folder as the MSI and be readable by SYSTEM and by the installing user (not a mapped drive).</>)}
            </StepCard>
            <CodeBlock title={t('Extracto orientativo de mgssetup.ini', 'mgssetup.ini excerpt (illustrative)')}>{t(`; Extracto: parte siempre de la plantilla descargada desde la consola.
; Directorio de instalación (opcional)
TMPMAINDIR = E:\\Program Files (x86)\\Flexera Software\\Agent

; Contactar con el beacon justo tras instalar para obtener la política
; (usa el valor que figure en tu plantilla: 1 / true)
INSTALLMACHINEPOLICY = 1

; Impedir la desinstalación desde Agregar o quitar programas (opcional)
ALLOWUNINSTALL = 0

[Custom Install Settings]
; URL del beacon (clave DEPLOYSERVERURL en la documentación; edita la línea de tu plantilla):
;   DEPLOYSERVERURL = https://beacon.empresa.com/ManageSoftDL
;   (http:// o https://, host/FQDN/IP, no UNC, termina en ManageSoftDL, máx. 80 caracteres;
;    varias URL separadas por ;)`,
`; Excerpt: always start from the template downloaded from the console.
; Installation directory (optional)
TMPMAINDIR = E:\\Program Files (x86)\\Flexera Software\\Agent

; Contact the beacon right after installing to fetch policy
; (use the value shown in your template: 1 / true)
INSTALLMACHINEPOLICY = 1

; Prevent uninstalling from Add/Remove Programs (optional)
ALLOWUNINSTALL = 0

[Custom Install Settings]
; Beacon URL (key DEPLOYSERVERURL in the documentation; edit the line in your template):
;   DEPLOYSERVERURL = https://beacon.company.com/ManageSoftDL
;   (http:// or https://, host/FQDN/IP, not a UNC path, ends in ManageSoftDL, max. 80 characters;
;    several URLs separated by ;)`)}</CodeBlock>
            <InfoBox type="warning">
              {t(<>Sin <code>INSTALLMACHINEPOLICY</code> el agente se instala pero queda a la espera de que otra fuente le entregue una política. Si la URL del beacon es incorrecta, los dispositivos no quedarán gestionados y habrá que reinstalarlos; si no se obtiene la política durante la instalación, el agente reintenta en cada reinicio.</>,
                 <>Without <code>INSTALLMACHINEPOLICY</code> the agent installs but sits idle, waiting for a policy from another source. If the beacon URL is wrong, devices will not be managed and will need to be reinstalled; if policy cannot be retrieved during installation, the agent retries at each reboot.</>)}
            </InfoBox>
            <InfoBox type="tip">
              {t('El seguimiento de uso de aplicaciones (application metering) está deshabilitado por defecto (USAGEAGENT_DISABLE = True); también puede definirse por regla de Discovery & Inventory desde la interfaz web.',
                 'Application usage tracking (application metering) is disabled by default (USAGEAGENT_DISABLE = True); it can also be set per discovery and inventory rule in the web interface.')}
            </InfoBox>
            <StepCard number={3} title={t('Instalar con msiexec', 'Install with msiexec')}>{t('Instalación silenciosa:', 'Silent installation:')}</StepCard>
            <CodeBlock title={t('Instalación silenciosa MSI', 'MSI silent installation')}>{t(`:: mgssetup.ini debe estar en la misma carpeta que el MSI
msiexec /i "FlexNet Inventory Agent.msi" /qn /l*v C:\\temp\\flexnet_install.log

:: Carpeta de instalación personalizada
msiexec /i "FlexNet Inventory Agent.msi" INSTALLDIR="E:\\Program Files (x86)\\Flexera Software\\Agent" /qb`,
`:: mgssetup.ini must be in the same folder as the MSI
msiexec /i "FlexNet Inventory Agent.msi" /qn /l*v C:\\temp\\flexnet_install.log

:: Custom installation folder
msiexec /i "FlexNet Inventory Agent.msi" INSTALLDIR="E:\\Program Files (x86)\\Flexera Software\\Agent" /qb`)}</CodeBlock>
            <InfoBox type="tip">
              {t(<>Si prefieres no escribir la línea de comandos, edita <code>Setup.ini</code> del zip (<code>[Startup] CmdLine=/l*v "%TEMP%\\FlexNet Inventory Agent.msi.log"</code>): añade <code>TRANSFORMS="custom.mst"</code> para una transformación o <code>REMOVE=aua</code> para no instalar el application usage agent. Los servicios se ejecutan como Local System.</>,
                 <>If you prefer not to write the command line, edit <code>Setup.ini</code> from the zip (<code>[Startup] CmdLine=/l*v "%TEMP%\\FlexNet Inventory Agent.msi.log"</code>): append <code>TRANSFORMS="custom.mst"</code> for a transform or <code>REMOVE=aua</code> to skip the application usage agent. The services run as Local System.</>)}
            </InfoBox>
            <StepCard number={4} title={t('Verificar', 'Verify')}>
              {t(<>Instalación: <code>%ProgramFiles(x86)%\ManageSoft</code>. Datos de trabajo: <code>%ProgramData%\ManageSoft Corp</code>. Logs: <code>%TEMP%\ManageSoft</code> de la cuenta que ejecuta el componente (para el servicio, normalmente <code>C:\Windows\Temp\ManageSoft</code>).</>,
                 <>Installation: <code>%ProgramFiles(x86)%\ManageSoft</code>. Working data: <code>%ProgramData%\ManageSoft Corp</code>. Logs: <code>%TEMP%\ManageSoft</code> of the account running the component (for the service, normally <code>C:\Windows\Temp\ManageSoft</code>).</>)}
            </StepCard>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Forzar política e inventario manualmente', 'Run policy and inventory manually')}</h3>
            <P>{t('Desde el agente 22.2.0 la configuración y la política las aplica flxconfig (ver Configuración); mgspolicy se conserva por compatibilidad.', 'Since agent 22.2.0, configuration and policy are applied by flxconfig (see Configuration); mgspolicy is kept for compatibility.')}</P>
            <CodeBlock title={t('CMD elevado', 'Elevated CMD')}>{t(`:: Descargar y aplicar la política
cd "%ProgramFiles(x86)%\\ManageSoft\\Policy Client"
mgspolicy.exe -t machine

:: Recolectar inventario
cd "%ProgramFiles(x86)%\\ManageSoft\\Tracker"
ndtrack.exe -t machine`,
`:: Download and apply the policy
cd "%ProgramFiles(x86)%\\ManageSoft\\Policy Client"
mgspolicy.exe -t machine

:: Collect inventory
cd "%ProgramFiles(x86)%\\ManageSoft\\Tracker"
ndtrack.exe -t machine`)}</CodeBlock>
            <InfoBox type="tip">
              {t('Al ejecutarlos a mano, los logs (policy.log, tracker.log) quedan en el directorio temporal del usuario que los lanza: %TEMP%\\ManageSoft. Con un CMD elevado suele coincidir con el de administrador, no con el del servicio.',
                 'When you run them by hand, the logs (policy.log, tracker.log) land in the temp directory of the user who launched them: %TEMP%\\ManageSoft. With an elevated CMD this is usually the administrator\'s, not the service\'s.')}
            </InfoBox>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Logs clave', 'Key logs')}</h3>
            <div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 8 }}>
              <thead><TRow header cells={[t('Archivo', 'File'), t('Componente', 'Component')]} /></thead>
              <tbody>
                <TRow cells={['installation.log', t('Instalador (ndlaunch)', 'Installer (ndlaunch)')]} />
                <TRow cells={['policy.log', t('Descarga de políticas (mgspolicy)', 'Policy download (mgspolicy)')]} />
                <TRow cells={['tracker.log', t('Inventario (ndtrack)', 'Inventory (ndtrack)')]} />
                <TRow cells={['schedule.log', t('Programador (ndschedag)', 'Scheduler (ndschedag)')]} />
                <TRow cells={['uploader.log', t('Subida (ndupload)', 'Upload (ndupload)')]} />
                <TRow cells={['usageagent.log', t('Tracking de uso (mgsusageag)', 'Usage tracking (mgsusageag)')]} />
                <TRow cells={['agent_configuration.log', t('Configuración del agente (flxconfig)', 'Agent configuration (flxconfig)')]} />
              </tbody>
            </table></div>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Desinstalación', 'Uninstallation')}</h3>
            <CodeBlock title={t('Desinstalar', 'Uninstall')}>{t(`:: Localizar el código de producto (GUID)
reg query "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall" /s /f "FlexNet Inventory Agent"

msiexec /x {PRODUCT-CODE-GUID} /qn /l*v "%TEMP%\\FlexNetAgent-Uninstall.log"`,
`:: Find the product code (GUID)
reg query "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall" /s /f "FlexNet Inventory Agent"

msiexec /x {PRODUCT-CODE-GUID} /qn /l*v "%TEMP%\\FlexNetAgent-Uninstall.log"`)}</CodeBlock>
            <P>{t(<>Quedan restos: la clave <code>HKLM\\SOFTWARE\\Wow6432Node\\ManageSoft Corp</code>, <code>C:\\ProgramData\\ManageSoft Corp</code>, logs y la caché del Launcher. La versión instalada está en <code>HKLM\\SOFTWARE\\Wow6432Node\\ManageSoft\\ETCPVersion</code>.</>,
                <>Leftovers remain: the <code>HKLM\\SOFTWARE\\Wow6432Node\\ManageSoft Corp</code> key, <code>C:\\ProgramData\\ManageSoft Corp</code>, logs and the Launcher cache. The installed version is in <code>HKLM\\SOFTWARE\\Wow6432Node\\ManageSoft\\ETCPVersion</code>.</>)}</P>
            <DocLinks links={[
              { label: 'Adopted: System Requirements', url: DOC.fiaSysReqs },
              { label: 'Agent Third-Party Deployment: Implementation', url: DOC.fa3Impl, note: t('Incluye los subtemas de configuración para Windows', 'Includes the Windows configuration subtopics') },
              { label: 'Agent Third-Party Deployment: Edit the Configuration File for Microsoft Windows', url: DOC.fa3SetupIni, note: 'mgssetup.ini' },
              { label: 'Adopted: Troubleshooting Inventory', url: DOC.fiaTrouble },
              { label: 'LogFile (inventory component)', url: DOC.logFile, note: t('Ubicación de tracker.log', 'tracker.log location') },
              { label: 'Command Lines', url: DOC.commandLines, note: 'mgspolicy · ndlaunch · ndschedag · ndtrack · ndupload · flxconfig' },
            ]} />
          </div>)}
        </div>
      );
    }

sudo ./FlexNetAgent-5.17-linux-x64.bin -i gui  # Wizard gráfico (X11)`,
`sudo ./FlexNetAgent-5.17-linux-x64.bin -i silent

            <StepCard number={4} title={t('Verificar', 'Verify')}>{t('Comprobar el servicio:', 'Check the service:')}</StepCard>
            <CodeBlock title={t('Verificar', 'Verify')}>{`systemctl status flexnetagent
tail -f /var/log/flexnetagent/*.log`}</CodeBlock>
            <InfoBox type="tip">

                 <>Since 2025 R2, the agent supports <strong>ARM64</strong> for environments such as AWS Graviton. Functionality is equivalent to x86_64.</>)}

            <DocLinks links={[
              { label: 'FlexNet Agent Installation Guide', url: DOC.fnmeaAgent },
              { label: 'FlexNet Manager for Engineering Applications Installation Guide', url: DOC.fnmeaInstall },
              { label: 'Flexera Product and License Center', url: DOC.plc, note: t('Descarga de instaladores', 'Installer downloads') },
            ]} />
          </div>) : (<div>
            <InfoBox type="warning">
              {t(<>Requiere <strong>root</strong> (modo por defecto) o el modo <em>least privilege</em> (ver abajo). Los demonios son <code>ndtask</code> (que lanza el programador <code>ndschedag</code>) y <code>mgsusageag</code> (seguimiento de uso). Plataformas: ver Matriz 1; cubre RHEL, SLES, Ubuntu, Debian, Oracle Linux, AIX y Solaris, entre otras.</>,
                 <>Requires <strong>root</strong> (default mode) or <em>least privilege</em> mode (see below). The daemons are <code>ndtask</code> (which starts the <code>ndschedag</code> scheduler) and <code>mgsusageag</code> (usage tracking). Platforms: see Matrix 1; it covers RHEL, SLES, Ubuntu, Debian, Oracle Linux, AIX and Solaris, among others.</>)}
            </InfoBox>
            <StepCard number={1} title={t('Preparar bootstrap', 'Prepare the bootstrap')}>
              {t(<>Debe existir <strong>ANTES</strong> de instalar en <code>/var/tmp/mgsft_rollout_response</code>. En UNIX las dos URL (descarga y subida) son obligatorias; admite varias separadas por <code>;</code>. Las plantillas bootstrap para Linux (i386 y x86_64) se descargan desde Installers (IT Visibility).</>,
                 <>It must exist <strong>BEFORE</strong> installing, at <code>/var/tmp/mgsft_rollout_response</code>. On UNIX both URLs (download and upload) are mandatory; several can be given separated by <code>;</code>. Linux bootstrap templates (i386 and x86_64) can be downloaded from Installers (IT Visibility).</>)}
            </StepCard>
            <CodeBlock title="/var/tmp/mgsft_rollout_response">{t(`MGSFT_BOOTSTRAP_DOWNLOAD=http://beacon.empresa.com/ManageSoftDL
MGSFT_BOOTSTRAP_UPLOAD=http://beacon.empresa.com/ManageSoftRL`,
`MGSFT_BOOTSTRAP_DOWNLOAD=http://beacon.company.com/ManageSoftDL
MGSFT_BOOTSTRAP_UPLOAD=http://beacon.company.com/ManageSoftRL`)}</CodeBlock>
            <StepCard number={2} title={t('Instalar según distribución', 'Install according to distribution')}>{t('Usa el sistema de paquetes nativo:', 'Use the native package manager:')}</StepCard>
            <CodeBlock title="RPM (RHEL, CentOS, SUSE, Oracle Linux…)">{t(`sudo rpm --upgrade --oldpackage --verbose managesoft-[VERSION]-1.x86_64.rpm

  --relocate /opt/managesoft=/new/install/path \\
  --relocate /var/opt/managesoft=/new/data/path`,
`sudo rpm --upgrade --oldpackage --verbose managesoft-[VERSION]-1.x86_64.rpm

# Custom path (same paths on every upgrade; no spaces)
sudo rpm --upgrade --oldpackage --verbose managesoft-[VERSION]-1.x86_64.rpm \\
  --relocate /opt/managesoft=/new/install/path \\
  --relocate /var/opt/managesoft=/new/data/path`)}</CodeBlock>
            <CodeBlock title="DEB (Debian, Ubuntu)">{t(`sudo dpkg --install managesoft_*[VERSION]*_amd64.deb   # i386: ..._i386.deb
# Los DEB no admiten ruta ni datos personalizados`,
`sudo dpkg --install managesoft_*[VERSION]*_amd64.deb   # i386: ..._i386.deb
# DEB packages do not support a custom path or data folder`)}</CodeBlock>
            <CodeBlock title="AIX">{`installp -aYX -d managesoft.[VERSION].bff managesoft.rte

# USIL (ruta personalizada / custom path; usa el mismo -R en upgrade, lslpp y desinstalación)
/usr/sbin/installp -R /new/install/path -aYX -d managesoft.[VERSION].bff managesoft.rte`}</CodeBlock>
            <CodeBlock title="Solaris">{t(`# Fichero admin silencioso
cat > admin <<'EOF'

idepend=nocheck

space=quit

action=nocheck
basedir=default
EOF
pkgadd -n -a admin -r /dev/null -d managesoft-[VERSION].sparc.pkg ManageSoft   # x86: paquete .i386 (verificar nombre)`,
`# Silent admin file
cat > admin <<'EOF'
mail=
instance=overwrite
partial=nocheck
runlevel=nocheck
idepend=nocheck
rdepend=nocheck
space=quit
setuid=nocheck
conflict=nocheck
action=nocheck
basedir=default
EOF
pkgadd -n -a admin -r /dev/null -d managesoft-[VERSION].sparc.pkg ManageSoft   # x86: .i386 package (verify the name)`)}</CodeBlock>
            <StepCard number={3} title={t('Verificar', 'Verify')}>
              {t(<>Binarios: <code>/opt/managesoft/bin</code> · Datos: <code>/var/opt/managesoft</code></>,
                 <>Binaries: <code>/opt/managesoft/bin</code> · Data: <code>/var/opt/managesoft</code></>)}
            </StepCard>
            <CodeBlock title={t('Verificar procesos y logs', 'Verify processes and logs')}>{t(`# Demonios del agente (se gestionan con el mecanismo nativo del SO: systemd, init, SRC…)
ps -ef | grep -E 'ndtask|ndschedag|mgsusageag'

# Logs: installation.log, schedule.log, tracker.log, uploader.log, usageagent.log
ls /var/opt/managesoft/log/`,
`# Agent daemons (managed by the native OS mechanism: systemd, init, SRC…)
ps -ef | grep -E 'ndtask|ndschedag|mgsusageag'

# Logs: installation.log, schedule.log, tracker.log, uploader.log, usageagent.log
ls /var/opt/managesoft/log/`)}</CodeBlock>
            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Configuración post-instalación', 'Post-installation configuration')}</h3>
            <CodeBlock title={t('Aplicar config con mgsconfig', 'Apply config with mgsconfig')}>{`cat > /var/tmp/tempconfig.ini << 'EOF'

            <InfoBox type="info">
              {t('En Linux, si usas HTTPS para comunicación con el beacon, necesitarás configurar manualmente los certificados CA (a diferencia de Windows donde es automático).',
                 'On Linux, if you use HTTPS to communicate with the beacon, you will need to configure the CA certificates manually (unlike Windows, where this is automatic).')}

            <InfoBox type="info">
              {t(<>Si configuras el bootstrap para instalar en modo <strong>least privilege</strong>, configura <code>sudo</code> en el sistema UNIX de destino. Para completar la configuración de certificados durante la instalación, el fichero debe estar en el dispositivo antes de ejecutar el instalador; si no, tras instalar puedes copiar el certificado completo a <code>/var/opt/managesoft/etc/ssl/cert.pem</code>.</>,
                 <>If you configure the bootstrap for the <strong>least privilege</strong> operation mode, configure <code>sudo</code> on the target UNIX system. To complete certificate set-up during installation, the file must be on the device before you run the installer; otherwise, after installing you can copy the completed certificate to <code>/var/opt/managesoft/etc/ssl/cert.pem</code>.</>)}

            <DocLinks links={[

              { label: 'Two FlexNet Kubernetes Agents', url: DOC.k8sTwo, note: t('Comparativa agente completo vs ligero', 'Full vs lightweight comparison') },
              { label: 'Download Flexera Kubernetes Inventory Agent', url: DOC.k8sDownload, note: t('Procedimiento completo de instalación', 'Complete installation procedure') },
              { label: 'Flexera Kubernetes Inventory Agent Configuration Examples', url: DOC.k8sExamples },

            <InfoBox type="info">
              {t(<>Desde la versión <strong>15.0.0</strong> (2020 R1), el agente incluye un <strong>Docker tracker</strong>. <strong>No habilitado por defecto.</strong> <strong>Podman</strong> en Linux desde la 22.4.0; <strong>containerd</strong> en el agente Linux desde la 25.1.0 y en imgtrack desde la 25.2.0.</>,
                 <>Since version <strong>15.0.0</strong> (2020 R1), the agent includes a <strong>Docker tracker</strong>. <strong>Not enabled by default.</strong> <strong>Podman</strong> on Linux since 22.4.0; <strong>containerd</strong> in the Linux agent since 25.1.0 and in imgtrack since 25.2.0.</>)}
            </InfoBox>
            <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
              {t(<>El agente se instala en el <strong>HOST</strong>, no dentro del contenedor. Usa inventario "zero footprint":</>,
                 <>The agent is installed on the <strong>HOST</strong>, not inside the container. It uses "zero footprint" inventory:</>)}
            </p>
            <div style={{ background: '#0d1117', borderRadius: 12, padding: 20, border: '1px solid #1e2a3a', margin: '16px 0', fontFamily: "'SF Mono', Consolas, monospace", fontSize: 13, color: '#c9d1d9', lineHeight: 1.8 }}>
              <div style={{ color: '#f48c06', fontWeight: 700 }}>{t('Flujo "Zero Footprint":', '"Zero Footprint" flow:')}</div>
              <div style={{ marginTop: 8 }}>
                {t(<>

                  2. Detecta inicio de contenedor desde imagen<br/>
                  3. Carga ndtrack DENTRO del contenedor en ejecución<br/>

                  5. Remueve ndtrack del contenedor (zero footprint)<br/>
                  6. Solo una vez por imagen (son inmutables)

                  2. Detects a container starting from an image<br/>
                  3. Loads ndtrack INSIDE the running container<br/>
                  4. Runs the inventory · Reports to the host<br/>
                  5. Removes ndtrack from the container (zero footprint)<br/>
                  6. Only once per image (images are immutable)
                </>)}

            <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Activar inventario Docker/Podman', 'Enable Docker/Podman inventory')}</h3>

                    <span style={{ color: '#f48c06', fontSize: 14, fontWeight: 700 }}>✓</span>
                  </div>
                  <span style={{ color: '#e0e0e0', fontSize: 14 }}>{txt}</span>
                </div>
              ))}
            </div>
            <StepCard number={2} title={t('Esperar propagación', 'Wait for propagation')}>
              {t(<>La política se propaga vía beacons. Puede tomar <strong>24-48 horas</strong> hasta que el inventario se procese.</>,
                 <>The policy propagates via beacons. It can take <strong>24-48 hours</strong> until the inventory is processed.</>)}
            </StepCard>
            <StepCard number={3} title={t('Verificar', 'Verify')}>
              {t(<>En la página <strong>All Containers</strong> (<OnPrem />: Discovery &amp; Inventory → Containers → All Containers).</>,
                 <>On the <strong>All Containers</strong> page (<OnPrem />: Discovery &amp; Inventory → Containers → All Containers).</>)}
            </StepCard>
            <InfoBox type="tip">
              {t('Como las imágenes Docker son inmutables, el agente solo inventaría una vez por imagen. El usage agent trackea inicio/parada/destrucción de contenedores.',
                 'Since Docker images are immutable, the agent only inventories each image once. The usage agent tracks container start/stop/destroy events.')}
            </InfoBox>
            <InfoBox type="info">
              {t('Según el changelog del agente: 24.1.1 corrige que los servicios del monitor Podman/Docker no se habilitaban ni arrancaban tras la instalación (afectaba a 23.5.0–24.1.0), 24.2.0 corrige el monitor Podman con UIDs superiores a 2000 y 25.0.0 corrige la reconexión del monitor Docker tras reiniciar Docker. Si ves huecos de inventario, revisa tu versión de agente.',
                 'According to the agent change log: 24.1.1 fixes Podman/Docker monitor services not being enabled and started after installation (affected 23.5.0–24.1.0), 24.2.0 fixes the Podman monitor for user IDs above 2000, and 25.0.0 fixes Docker monitor reconnection after a Docker restart. If you see inventory gaps, check your agent version.')}
            </InfoBox>
            <DocLinks links={[
              { label: 'Flexera Container Monitor', url: DOC.containerMon },
              { label: 'FlexNet Inventory Agent Change Log', url: DOC.changelog, note: t('Correcciones de los monitores Docker y Podman', 'Docker and Podman monitor fixes') },
              { label: 'Adopted: System Requirements', url: DOC.fiaSysReqs },
            ]} />
          </div>)}
        </div>
      );

    function ConfigContent() {
      const { t } = useLang();
      return (
        <div>
          <h2 style={{ color: '#f0f0f0', fontSize: 26, margin: '0 0 16px', fontWeight: 800 }}>{t('Configuración Avanzada', 'Advanced Configuration')}</h2>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 8 }}>{t('Puertos y Comunicación', 'Ports and Communication')}</h3>
          <div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 8 }}>
            <thead><TRow header cells={[t('Puerto', 'Port'), t('Protocolo', 'Protocol'), t('Uso', 'Usage')]} /></thead>
            <tbody>
              <TRow cells={['80', 'HTTP', t('Comunicación por defecto agente ↔ Inventory Beacon', 'Default agent ↔ Inventory Beacon communication')]} />
              <TRow cells={['443', 'HTTPS', t('Beacon ↔ Flexera One (siempre) y agente ↔ beacon cuando activas HTTPS', 'Beacon ↔ Flexera One (always) and agent ↔ beacon when you enable HTTPS')]} />
              <TRow cells={['445 · 139', 'TCP', t('Ejecución remota del beacon en dispositivos Windows (SMB / NetBIOS): adopción y zero-footprint', 'Beacon remote execution on Windows devices (SMB / NetBIOS): adoption and zero-footprint')]} />
              <TRow cells={['22', 'TCP', t('Ejecución remota del beacon en dispositivos UNIX (SSH): adopción y zero-footprint', 'Beacon remote execution on UNIX devices (SSH): adoption and zero-footprint')]} />
              <TRow cells={['27000-27009', 'TCP', t('Solo FlexNet Manager for Engineering Applications: rango por defecto de FlexNet Publisher (lmgrd). No forma parte de agente ↔ beacon ↔ Flexera One', 'FlexNet Manager for Engineering Applications only: default FlexNet Publisher (lmgrd) range. Not part of agent ↔ beacon ↔ Flexera One')]} />
              <TRow cells={['61616', 'TCP', t('Solo FNMEA: valor por defecto del comando de rotación de logs de FlexNet Manager Suite hacia FlexNet Manager for Engineering Applications (según KB de Flexera)', 'FNMEA only: default for the log rotation command from FlexNet Manager Suite to FlexNet Manager for Engineering Applications (per Flexera KB)')]} />
            </tbody>
          </table></div>
          <InfoBox type="info">
            {t('Todos los puertos son configurables vía preferencias incluyendo el puerto en las URLs del beacon.',
               'All ports are configurable via preferences, including the port in the beacon URLs.')}
          </InfoBox>
          <InfoBox type="tip">
            {t('En los firewalls entre el beacon y FlexNet Manager Suite (cloud) usa nombres DNS en lugar de direcciones IP: las IP pueden cambiar sin aviso o con poca antelación. La comunicación entre el beacon de nivel superior y la nube, y la ejecución remota, requieren IPv4.',
               'On firewalls between the beacon and FlexNet Manager Suite (cloud), use DNS host names instead of IP addresses: IPs can change without notice or with little warning. Communication between the top-level beacon and the cloud, and remote execution, require IPv4.')}
          </InfoBox>
          <Note>{t('Las URL y los endpoints de Flexera One por región están en Network requirements; el resumen para el beacon está en la sección «Beacon y sin agente».', 'The Flexera One URLs and regional endpoints are in Network requirements; the beacon summary is in the "Beacon and agentless" section.')}</Note>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>config.ini (UNIX/macOS)</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t(<>Archivo principal en <code>/var/opt/managesoft/etc/config.ini</code>. No editarlo directamente — usar <code>mgsconfig</code>:</>,
               <>Main file at <code>/var/opt/managesoft/etc/config.ini</code>. Do not edit it directly — use <code>mgsconfig</code>:</>)}
          </p>
          <CodeBlock title={t('Actualizar config parcialmente', 'Partially update the config')}>{`cat > /var/tmp/patch.ini << 'EOF'
[ManageSoft\\Launcher\\CurrentVersion]
NetworkSense=False
EOF

/opt/managesoft/bin/mgsconfig -i /var/tmp/patch.ini`}</CodeBlock>
          <Note>{t(<>Bootstrap HTTPS en UNIX: copia el certificado CA a <code>/var/tmp/mgsft_rollout_cert</code> (y, para mTLS, el certificado y la clave de cliente) antes de instalar; el instalador los mueve a <code>/var/opt/managesoft/etc/ssl/</code>. Desde 23.3.0 el bootstrap admite varias ubicaciones separadas por <code>;</code>. Detalle en Linux → Instalación.</>,
            <>HTTPS bootstrap on UNIX: copy the CA certificate to <code>/var/tmp/mgsft_rollout_cert</code> (and, for mTLS, the client certificate and key) before installing; the installer moves them to <code>/var/opt/managesoft/etc/ssl/</code>. Since 23.3.0 the bootstrap supports several locations separated by <code>;</code>. Details in Linux → Installation.</>)}</Note>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Configuración en Windows', 'Configuration on Windows')}</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t('En Windows se almacena en el Registro. Se configura vía: parámetros MSI, transforms (.mst), bootstrap (mgssetup.ini), o políticas del beacon.',
               'On Windows it is stored in the Registry. It is configured via: MSI parameters, transforms (.mst), bootstrap (mgssetup.ini), or beacon policies.')}
          </p>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Proxy', 'Proxy')}</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t(<>En Windows el agente lee las preferencias de registro <code>http_proxy</code>, <code>https_proxy</code> y <code>no_proxy</code> (en <code>[Registry]\ManageSoft\Launcher\CurrentVersion</code>, notación de la documentación). En UNIX/macOS se pueden fijar desde el bootstrap:</>,
               <>On Windows the agent reads the <code>http_proxy</code>, <code>https_proxy</code> and <code>no_proxy</code> registry preferences (under <code>[Registry]\ManageSoft\Launcher\CurrentVersion</code>, documentation notation). On UNIX/macOS they can be set from the bootstrap:</>)}
          </p>
          <CodeBlock title="/var/tmp/mgsft_rollout_response">{t(`# Configuración de proxy opcional (descomenta para activarla; NONE la desactiva)
MGSFT_HTTP_PROXY=http://proxy.empresa.com:3128
# MGSFT_HTTPS_PROXY=https://proxy.empresa.com:3129
# MGSFT_NO_PROXY=interno1.local,interno2.local`,
`# Optional proxy configuration (uncomment to enable; NONE disables it)
MGSFT_HTTP_PROXY=http://proxy.company.com:3128
# MGSFT_HTTPS_PROXY=https://proxy.company.com:3129
# MGSFT_NO_PROXY=internal1.local,internal2.local`)}</CodeBlock>
          <InfoBox type="warning">
            {t(<>Los Inventory Beacons no admiten scripts de autoconfiguración de proxy (PAC). Existe además una <Ext href={DOC.noProxyKnown}>incidencia conocida</Ext> con la preferencia <code>no_proxy</code>; revísala antes de depender de ella. Desde la versión 24.2.0 del agente, la configuración de proxy da prioridad a la clave de proxy del beacon.</>,
               <>Inventory Beacons do not support proxy auto-configuration (PAC) scripts. There is also a <Ext href={DOC.noProxyKnown}>known issue</Ext> with the <code>no_proxy</code> preference; check it before relying on it. Since agent version 24.2.0, proxy settings give priority to the beacon&apos;s proxy key.</>)}
          </InfoBox>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Configuración con flxconfig', 'Configuration with flxconfig')}</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t(<>Desde la versión 22.2.0, el agente incluye <code>flxconfig</code>, el componente que comprueba y aplica la configuración del agente en el dispositivo (disponible con IT Asset Management). Normalmente se ejecuta sin parámetros; opciones principales:</>,
               <>From version 22.2.0, the agent includes <code>flxconfig</code>, the component that checks and applies agent configuration on the device (available with IT Asset Management). It is normally run without parameters; main options:</>)}
          </p>
          <CodeBlock title="flxconfig">{t(`flxconfig                                        # comprobar y aplicar la configuración
flxconfig --download-server http://beacon.empresa.com
flxconfig --disable-upgrade true                 # no procesar paquetes de actualización
flxconfig --disable-netselector true             # no procesar algoritmos de selección de beacon
flxconfig --disable-failover true                # no procesar ajustes de failover
flxconfig --local-config-file agent_config.json  # usar un JSON local en vez del beacon`,
`flxconfig                                        # check and apply configuration
flxconfig --download-server http://beacon.company.com
flxconfig --disable-upgrade true                 # do not process upgrade packages
flxconfig --disable-netselector true             # do not process beacon-selection algorithms
flxconfig --disable-failover true                # do not process failover settings
flxconfig --local-config-file agent_config.json  # use a local JSON instead of the beacon`)}</CodeBlock>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7 }}>
            {t(<>Su log por defecto es <code>%TEMP%\ManageSoft\agent_configuration.log</code> en Windows. La versión 23.4.0 añadió soporte del modo <code>LowProfile</code> a flxconfig.</>,
               <>Its default log is <code>%TEMP%\ManageSoft\agent_configuration.log</code> on Windows. Version 23.4.0 added <code>LowProfile</code> mode support to flxconfig.</>)}
          </p>
          <h3 style={{ color: '#e0e0e0', fontSize: 18, marginTop: 28 }}>{t('Actualización automática', 'Automatic upgrade')}</h3>
          <InfoBox type="info">
            {t(<>La versión objetivo, los modos, las plataformas y las limitaciones (least privilege en UNIX, herramientas de terceros, ruta personalizada) están ahora en la sección <strong>Actualización</strong>. Con <code>flxconfig --disable-upgrade true</code> un dispositivo concreto deja de procesar paquetes de actualización.</>,
               <>The target version, modes, platforms and limitations (least privilege on UNIX, third-party tools, custom path) are now in the <strong>Upgrades</strong> section. With <code>flxconfig --disable-upgrade true</code> a specific device stops processing upgrade packages.</>)}
          </InfoBox>
          <DocLinks links={[
            { label: 'Network Requirements (IT Asset Management)', url: DOC.networkReqs },
            { label: 'Network requirements (ITAM Release Notes)', url: DOC.netReqs, note: t('Endpoints de Flexera One por región', 'Flexera One endpoints by region') },
            { label: 'Ports Required by the FlexNet Manager Suite Core Compliance Server', url: DOC.portsKb, note: t('Artículo de la Knowledge Base', 'Knowledge Base article') },
            { label: 'flxconfig Command Line', url: DOC.flxconfig },
            { label: 'The FlexNet Inventory Agent can be configured using flxconfig', url: DOC.flxconfigNews },
            { label: 'http_proxy', url: DOC.httpProxy },

            { label: 'no_proxy', url: DOC.noProxy },
            { label: 'Configuring for Proxy Servers (Inventory Beacons)', url: DOC.beaconProxy },

            { label: 'Inventory Agent for Automatic Deployment (Flexera One)', url: DOC.autoDeploy },
            { label: 'Agent Third-Party Deployment: Configuring Installations on UNIX-like Platforms', url: DOC.fa3CustomUnix },
            { label: 'Agent Third-Party Deployment: Enabling the HTTPS Protocol on UNIX Agents', url: DOC.fa3Https },
          ]} />
        </div>
      );

    /* ─── Section: Troubleshooting ─── */

    function TroubleshootingContent() {
      const { t } = useLang();
      const faqs = [
        { q: t('El agente no se comunica con el Inventory Beacon', 'The agent does not communicate with the Inventory Beacon'),
          a: t('Verifica conectividad (telnet/curl al puerto 80/443). Comprueba URLs en mgsft_rollout_response (UNIX) o mgssetup.ini (Windows). Revisa policy.log y uploader.log. Verifica firewall/proxy.',
               'Check connectivity (telnet/curl to port 80/443). Verify the URLs in mgsft_rollout_response (UNIX) or mgssetup.ini (Windows). Review policy.log and uploader.log. Check the firewall/proxy.') },
        { q: t('Instalación silenciosa en Windows falla', 'Silent installation on Windows fails'),
          a: t('Asegúrate de ejecutar como Administrador real (cmd elevado). Verifica sintaxis de msiexec (sin espacios extra después de /v"). Revisa log con /l*v.',
               'Make sure you run as a real Administrator (elevated cmd). Check the msiexec syntax (no extra spaces after /v"). Review the log with /l*v.') },
        { q: t('Popup de Java en macOS', 'Java popup on macOS'),
          a: t('Problema conocido con Java viejo en /System/Library/Frameworks/JavaVM.framework. Excluir directorio del file scanning en Inventory Settings.',
               'Known issue with old Java in /System/Library/Frameworks/JavaVM.framework. Exclude the directory from file scanning in Inventory Settings.') },
        { q: t('Servicios no inician en Linux', 'Services do not start on Linux'),
          a: t('Verifica que mgsft_rollout_response existía en /var/tmp/ ANTES de instalar. Revisa /var/opt/managesoft/log/installation.log. Verificar instalación con sudo/root.',
               'Verify that mgsft_rollout_response existed in /var/tmp/ BEFORE installing. Review /var/opt/managesoft/log/installation.log. Verify the installation was done with sudo/root.') },
        { q: t('Inventario Docker no aparece', 'Docker inventory does not appear'),
          a: t('Verificar "Enable Docker inventory" en Inventory Settings → Container scanning. Esperar 24-48h. El agente debe estar en el HOST, no dentro del contenedor.',
               'Check "Enable Docker inventory" in Inventory Settings → Container scanning. Wait 24-48h. The agent must be on the HOST, not inside the container.') },
        { q: t('Kubernetes Agent no reporta', 'Kubernetes Agent does not report'),
          a: t('Verificar pod corriendo (kubectl get pods). Comprobar URL del beacon en YAML. Revisar logs del pod. Solo una instancia por clúster.',
               'Check that the pod is running (kubectl get pods). Verify the beacon URL in the YAML. Review the pod logs. Only one instance per cluster.') },
        { q: t('Problemas HTTPS en UNIX/macOS', 'HTTPS issues on UNIX/macOS'),
          a: t('UNIX requiere configuración manual de certificados CA (Windows lo hace automáticamente): deja el CA en /var/tmp/mgsft_rollout_cert antes de instalar (acaba en /var/opt/managesoft/etc/ssl/cert.pem) y, si el beacon pide mTLS, el certificado y la clave de cliente en /var/tmp/mgsft_rollout_client_cert y mgsft_rollout_client_private_key. Recuerda que la adopción exige HTTP. Si no puedes resolverlo, usa HTTP para el bootstrap.',
               'UNIX requires manual CA certificate configuration (Windows does it automatically): place the CA at /var/tmp/mgsft_rollout_cert before installing (it ends up at /var/opt/managesoft/etc/ssl/cert.pem) and, if the beacon requires mTLS, the client certificate and key at /var/tmp/mgsft_rollout_client_cert and mgsft_rollout_client_private_key. Remember that adoption requires HTTP. If you cannot resolve it, use HTTP for the bootstrap.') },
        { q: t('El agente no se actualiza solo', 'The agent does not upgrade itself'),
          a: t('Comprueba, por este orden: (1) que el modo sea «Upgrade selected platforms» (o la variante por destinos) y la plataforma esté marcada; (2) que haya pasado un día (los dispositivos consultan la política una vez al día, entre las 5 y las 6 de la mañana, a hora aleatoria) y que entre dos cambios hayan pasado 48 h; (3) que el agente no esté en least privilege en UNIX ni se gestione con una herramienta de terceros; (4) que no hayas ejecutado flxconfig --disable-upgrade true; (5) que, con ruta personalizada en AIX/Linux, el agente sea 13.2.0 o superior; (6) en Debian/Ubuntu, que tu tenant lo soporte (el changelog lo indica desde 22.2.0, la página de cautelas no). Si el beacon es anterior a 22.2.0, no habrá self-upgrade a agentes 22.2.0+.',
               'Check, in this order: (1) the mode is "Upgrade selected platforms" (or the per-target variant) and the platform is ticked; (2) a day has passed (devices fetch the policy once a day, between 5 and 6 a.m., at a random time) and 48 h have elapsed between two changes; (3) the agent is not in UNIX least-privilege mode or managed by a third-party tool; (4) you have not run flxconfig --disable-upgrade true; (5) with a custom path on AIX/Linux, the agent is 13.2.0 or later; (6) on Debian/Ubuntu, that your tenant supports it (the change log says since 22.2.0, the cautions page does not). If the beacon is older than 22.2.0, there is no self-upgrade to 22.2.0+ agents.') },
        { q: t('Tras actualizar el beacon a 26.4.1, agentes 22.2–23.4 dejan de recibir políticas', 'After upgrading the beacon to 26.4.1, agents 22.2–23.4 stop receiving policies'),
          a: t('Es el efecto de aplicar la «recommended secure endpoint configuration» del beacon: esos agentes siguen subiendo inventario y uso, pero no descargan políticas ni se auto-actualizan. Actualiza esos agentes (manualmente o con tu herramienta de despliegue) antes de aplicar la configuración segura. Flexera advierte de no habilitar el acceso anónimo a todos los endpoints como atajo.',
               'This is the effect of applying the beacon "recommended secure endpoint configuration": those agents keep uploading inventory and usage, but do not download policies or self-upgrade. Upgrade those agents (manually or with your deployment tool) before applying the secure configuration. Flexera advises against enabling anonymous access to all endpoints as a workaround.') },
        { q: t('Zero-footprint no recolecta un dispositivo', 'Zero-footprint does not collect a device'),
          a: t('Comprueba que el dispositivo no tenga ya un agente instalado o adoptado (en ese caso la recolección zero-footprint se detiene), que la cuenta tenga los privilegios descritos en «Zero-Footprint: Accounts and Privileges», que el beacon llegue por SMB 445 / NetBIOS 139 (Windows) o SSH 22 (UNIX) y que, en UNIX, no esperes HTTPS (no se admite). Revisa los logs del beacon y del componente de inventario.',
               'Check that the device does not already have an installed or adopted agent (in that case zero-footprint collection stops), that the account has the privileges described in "Zero-Footprint: Accounts and Privileges", that the beacon can reach it over SMB 445 / NetBIOS 139 (Windows) or SSH 22 (UNIX), and that on UNIX you are not expecting HTTPS (not supported). Review the beacon and inventory component logs.') },
        { q: t('Nodos de Kubernetes duplicados en el inventario', 'Duplicate Kubernetes nodes in the inventory'),
          a: t('Pasa si activas el inventario de nodos del agente Kubernetes completo y, además, los nodos tienen el agente Linux. Instala el agente Linux solo donde no actives el inventario de nodos, o desactiva en él el inventario de contenedores.',
               'This happens if you enable node inventory in the full Kubernetes agent and the nodes also run the Linux agent. Install the Linux agent only where node inventory is not enabled, or disable container inventory on it.') },
        { q: t('El agente de Windows se instala pero no recolecta nada', 'The Windows agent installs but collects nothing'),
          a: t('Comprueba que INSTALLMACHINEPOLICY esté descomentado y a true en mgssetup.ini (sin él, el agente queda esperando una política) y que la URL de [Custom Install Settings] termine en ManageSoftDL, no sea una ruta UNC y no supere 80 caracteres. Si la URL era incorrecta, el dispositivo no queda gestionado y hay que reinstalar.',
               'Check that INSTALLMACHINEPOLICY is uncommented and set to true in mgssetup.ini (without it the agent waits for a policy) and that the [Custom Install Settings] URL ends in ManageSoftDL, is not a UNC path and does not exceed 80 characters. If the URL was wrong, the device is not managed and must be reinstalled.') },
        { q: t('Cómo activar trazas avanzadas (etcp.trace)', 'How to enable advanced tracing (etcp.trace)'),
          a: t('Edita etcp.trace, que está junto al ejecutable ndtrack (Windows: C:\\Program Files (x86)\\ManageSoft\\etcp.trace; UNIX: /opt/managesoft/etcp.trace). Descomenta una línea "filename=" (borra solo el # inicial) y ajústala, p. ej. filename=C:\\ManageSoft.log en Windows o filename=/tmp/log/mgstrace.log en UNIX.',
               'Edit etcp.trace, located next to the ndtrack executable (Windows: C:\\Program Files (x86)\\ManageSoft\\etcp.trace; UNIX: /opt/managesoft/etcp.trace). Uncomment a "filename=" line (delete only the leading #) and adjust it, e.g. filename=C:\\ManageSoft.log on Windows or filename=/tmp/log/mgstrace.log on UNIX.') },
        { q: t('Dónde está tracker.log', 'Where is tracker.log'),
          a: t('Con el agente completo: en Windows, $(TempDirectory)\\ManageSoft\\tracker.log (el temporal de la cuenta que ejecuta ndtrack); en UNIX-like, /var/opt/managesoft/log/tracker.log cuando ndtrack se ejecuta como root. Con el Inventory Scanner en UNIX: /var/tmp/flexera/log/tracker.log, o /var/tmp/flexera.userName/log/ si no es root.',
               'With the full agent: on Windows, $(TempDirectory)\\ManageSoft\\tracker.log (the temp folder of the account running ndtrack); on UNIX-like, /var/opt/managesoft/log/tracker.log when ndtrack runs as root. With the Inventory Scanner on UNIX: /var/tmp/flexera/log/tracker.log, or /var/tmp/flexera.userName/log/ if not root.') },
      ];
      return (
        <div>

    function BeaconContent() {
      const { t } = useLang();

          {sub === 'beacon' ? (<div>
            <P>{t('El beacon es el relé obligatorio entre los agentes y Flexera One: sirve política y paquetes por ManageSoftDL, recibe inventarios por ManageSoftRL y los reenvía a la nube por HTTPS. Se instala en un servidor Windows por subred o sitio donde haya dispositivos que descubrir.', 'The beacon is the mandatory relay between agents and Flexera One: it serves policy and packages through ManageSoftDL, receives inventories through ManageSoftRL and forwards them to the cloud over HTTPS. It is installed on a Windows server per subnet or site where there are devices to discover.')}</P>
            <InfoBox type="tip">
              {t('Sin un beacon local en cada subred con descubrimiento, la identificación por MAC (ARP/nbtstat) puede fallar y aparecer dispositivos descubiertos duplicados.', 'Without a local beacon in each subnet that is being discovered, MAC identification (ARP/nbtstat) can fail and duplicate discovered devices can appear.')}
            </InfoBox>
            <H3>{t('Requisitos', 'Requirements')}</H3>
            <Tbl head={[t('Elemento', 'Item'), t('Requisito', 'Requirement')]} rows={[
              [t('Sistema operativo', 'Operating system'), 'Windows Server 2016 / 2019 / 2022 / 2025 · Windows 10 / 11'],

              [t('Hardware', 'Hardware'), t('2 núcleos · 4 GB RAM mínimo (8 GB recomendado) · 1 GB libre por cada 10.000 dispositivos', '2 cores · 4 GB RAM minimum (8 GB recommended) · 1 GB free per 10,000 devices')],
              [t('Opcional por conector', 'Optional per connector'), t('AWS Tools for PowerShell 3.3.283.0+ · Az 6.1.0+ y Azure Resource Graph 0.11+ · Oracle OLE DB 64 bits 10.2.0.3+ · Microsoft 365 Access Runtime (adaptadores xlsx)', 'AWS Tools for PowerShell 3.3.283.0+ · Az 6.1.0+ and Azure Resource Graph 0.11+ · Oracle OLE DB 64-bit 10.2.0.3+ · Microsoft 365 Access Runtime (xlsx adapters)')],
              [t('Red', 'Network'), t('Salida HTTPS a Flexera One (IPv4), puertos 80/443 desde los agentes y 445/139/22 hacia los destinos si usas adopción o zero-footprint', 'HTTPS outbound to Flexera One (IPv4), ports 80/443 from agents and 445/139/22 to targets if you use adoption or zero-footprint')],
            ]} />
            <H3>{t('Instalación y alta en Flexera One', 'Installation and registration in Flexera One')}</H3>
            <StepCard number={1} title={t('Descargar el instalador', 'Download the installer')}>
              {t(<>En la consola: <strong>Data Collection → Common Inventory Tasks → Common Beacons → Download Beacon</strong>, que abre la página <strong>Installers</strong>. El fichero se llama <code>BeaconInstaller&lt;versión&gt;.exe</code>.</>,
                 <>In the console: <strong>Data Collection → Common Inventory Tasks → Common Beacons → Download Beacon</strong>, which opens the <strong>Installers</strong> page. The file is named <code>BeaconInstaller&lt;version&gt;.exe</code>.</>)}
            </StepCard>
            <StepCard number={2} title={t('Preparar el servidor', 'Prepare the server')}>
              {t('Añade la URL de Flexera One a los sitios de confianza del servidor si Windows bloquea la descarga, y comprueba .NET Framework 4.8 y PowerShell 5.1.', 'Add the Flexera One URL to the server trusted sites if Windows blocks the download, and check .NET Framework 4.8 and PowerShell 5.1.')}
            </StepCard>
            <StepCard number={3} title={t('Ejecutar el instalador', 'Run the installer')}>
              {t('Recorre el asistente y valida los ajustes propuestos. El servicio se ejecuta como SYSTEM; si le asignas credenciales propias (necesarias, p. ej., para subir a un beacon padre), se restablecen en cada actualización del beacon.', 'Step through the wizard and validate the proposed settings. The service runs as SYSTEM; if you assign your own credentials (needed, e.g., to upload to a parent beacon), they are reset on every beacon upgrade.')}
            </StepCard>
            <StepCard number={4} title={t('Crear el beacon en Flexera One', 'Create the beacon in Flexera One')}>
              {t(<>Indica el <strong>Beacon UID</strong>, el <strong>destino</strong> (ITAM o ITV) y el <strong>modo de actualización</strong>; después usa <strong>Download Configuration</strong> y aplica el fichero en el servidor.</>,
                 <>Enter the <strong>Beacon UID</strong>, the <strong>destination</strong> (ITAM or ITV) and the <strong>upgrade mode</strong>; then use <strong>Download Configuration</strong> and apply the file on the server.</>)}

            <StepCard number={5} title={t('Verificar', 'Verify')}>
              {t('Comprueba en el Programador de tareas que existen las tareas de subida (p. ej. «Upload Flexera inventories», con ejecuciones cada 1–10 minutos) y que el beacon aparece conectado en Flexera One.', 'Check in Task Scheduler that the upload tasks exist (e.g. "Upload Flexera inventories", running every 1–10 minutes) and that the beacon shows as connected in Flexera One.')}
            </StepCard>
            <H3>{t('Modos de actualización del beacon', 'Beacon upgrade modes')}</H3>
            <Tbl head={[t('Modo', 'Mode'), t('Uso', 'Use')]} rows={[
              ['Manual', t('Valor por defecto y recomendado: decides tú cuándo actualizar (imprescindible para controlar saltos como el de 64 bits en 25.3.0).', 'Default and recommended: you decide when to upgrade (essential to control jumps such as the 64-bit one in 25.3.0).')],
              ['Always approved · Always latest · Specific version', t('Actualización automática según el criterio elegido. Confirma su semántica exacta en la página de creación de beacons antes de usarlos en producción.', 'Automatic upgrade according to the chosen criterion. Confirm their exact semantics on the beacon creation page before using them in production.')],
            ]} />
            <Note>{t('Desde 26.4.0 los beacons de ITAM limpian automáticamente los paquetes de agente y beacon obsoletos (previsto también para ITV).', 'Since 26.4.0, ITAM beacons automatically clean up obsolete agent and beacon packages (also planned for ITV).')}</Note>
            <H3>{t('Destinos de red (Flexera One)', 'Network destinations (Flexera One)')}</H3>
            <Tbl head={[t('Uso', 'Use'), t('EE. UU.', 'US'), 'EU', 'APAC']} rows={[

              [t('Datos de inventario (ITAM)', 'Inventory data (ITAM)'), 'data.flexnetmanager.com', 'data.flexnetmanager.eu', 'data.flexnetmanager.au'],
              [t('Beacon → ITV', 'Beacon → ITV'), 'beacon.flexera.com · us-west-2.beacons.flexeraeng.com/inventorybeacons', 'beacon.flexera.eu · eu-central-1.beacons.flexeraeng.com/inventorybeacons', 'beacon.flexera.au'],
              [t('Aplicación web', 'Web application'), 'app.flexera.com', 'app.flexera.eu', 'app.flexera.au'],
              [t('Identidad (IAM)', 'Identity (IAM)'), 'login / secure / api.flexera.com · my.rightscale.com', 'login / secure / api.flexera.eu', 'login / secure / api.flexera.au'],
            ]} />
            <Note>{t('Revocación de certificados: HTTP puerto 80 hacia *.amazontrust.com, *.digicert.com y *.lencr.org. Solo HTTPS hacia Flexera One (HTTP responde 307 + HSTS). Usa nombres DNS, no IP, en los firewalls. Los entornos UAT usan el sufijo -uat.', 'Certificate revocation: HTTP port 80 to *.amazontrust.com, *.digicert.com and *.lencr.org. HTTPS only towards Flexera One (HTTP answers 307 + HSTS). Use DNS names, not IPs, in firewalls. UAT environments use the -uat suffix.')}</Note>
            <H3>{t('Proxy y HTTPS hacia los agentes', 'Proxy and HTTPS towards agents')}</H3>
            <P>{t(<>Para que el beacon salga por un proxy, configura en el registro del beacon exactamente uno de <code>[Registry]\Common\https_proxy</code> / <code>http_proxy</code> (según el protocolo de destino) y el valor equivalente en <code>Launcher\CurrentVersion</code>, y reinicia el servicio FlexNet Beacon Engine. No se admiten scripts PAC. Entre agente y beacon, el servidor web usa HTTP por defecto; HTTPS es opcional y en UNIX exige instalar el certificado de la CA (<code>/var/tmp/mgsft_rollout_cert</code> antes de instalar).</>,
              <>To make the beacon go out through a proxy, configure in the beacon registry exactly one of <code>[Registry]\Common\https_proxy</code> / <code>http_proxy</code> (according to the destination protocol) and the equivalent value under <code>Launcher\CurrentVersion</code>, then restart the FlexNet Beacon Engine service. PAC scripts are not supported. Between agent and beacon the web server uses HTTP by default; HTTPS is optional and on UNIX requires installing the CA certificate (<code>/var/tmp/mgsft_rollout_cert</code> before installing).</>)}</P>
            <DocLinks links={[
              { label: 'Downloading and Installing the FlexNet Beacon Software', url: DOC.beaconDownload },
              { label: 'Creating an Inventory Beacon to Upload Inventory to Flexera One', url: DOC.beaconCreate },
              { label: 'Installing an IT Asset Management Inventory Beacon', url: DOC.installBeaconItam },
              { label: 'Prerequisites for Inventory Beacons (IT Assets)', url: DOC.beaconPrereqItam },
              { label: 'Inventory Beacon Change Log', url: DOC.beaconLog },
              { label: 'Network requirements', url: DOC.netReqs },
              { label: 'Configuring for Proxy Servers (Inventory Beacons)', url: DOC.beaconProxy },
              { label: 'Agent Third-Party Deployment: Enabling the HTTPS Protocol on UNIX Agents', url: DOC.fa3Https },
            ]} />
          </div>) : (<div>
            <H3>Zero-footprint</H3>
            <P>{t('El beacon instala temporalmente un servicio (Windows, por SMB/NetBIOS) o se conecta por SSH (UNIX-like), ejecuta ndtrack, recoge el inventario y se retira: no queda nada instalado. Los componentes core viajan con cada beacon, por lo que no hay nada que desplegar.', 'The beacon temporarily sets up a service (Windows, over SMB/NetBIOS) or connects over SSH (UNIX-like), runs ndtrack, collects the inventory and removes itself: nothing stays installed. The core components ship with every beacon, so there is nothing to deploy.')}</P>
            <StepCard number={1} title={t('Beacon operativo en la subred', 'Beacon operational in the subnet')}>
              {t('La cuenta del servicio del beacon debe poder iniciar sesión como trabajo por lotes y ejecutar tareas programadas (y, con IIS, los application pools).', 'The beacon service account must be able to log on as a batch job and run scheduled tasks (and, with IIS, application pools).')}
            </StepCard>
            <StepCard number={2} title={t('Abrir puertos de ejecución remota', 'Open remote execution ports')}>

            </StepCard>
            <StepCard number={3} title={t('Credenciales', 'Credentials')}>
              {t('Windows: una cuenta que inicializa el servicio remoto y otra operativa que recolecta; añade filtros de intentos de contraseña por destino para que no se interrumpa la ejecución por probar demasiadas credenciales. UNIX: root recomendado; con un usuario no root el inventario queda incompleto.', 'Windows: an account that initializes the remote service and an operational one that collects; add per-target password-attempt limits so the run is not cut off for trying too many credentials. UNIX: root recommended; with a non-root user the inventory is incomplete.')}

            <StepCard number={4} title={t('Reglas de descubrimiento e inventario', 'Discovery and inventory rules')}>

./ndtrack.sh -o UploadLocation="http://beacon.company.com/ManageSoftRL"`}</CodeBlock>
