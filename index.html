<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexNet Agents — Guía de Instalación y Configuración</title>
  <meta name="description" content="Guía completa de instalación y configuración de FlexNet Agents de Flexera para Windows, Linux, macOS y Contenedores." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0a0e1a; color: #e0e0e0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    code { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace; background: #1a2332; padding: 1px 6px; border-radius: 4px; font-size: 0.9em; color: #f48c06; }
    pre code { background: none; padding: 0; }
    details summary::-webkit-details-marker { display: none; }
    .doc-link:hover { text-decoration: underline !important; }
    details[open] summary span.arrow { transform: rotate(90deg); display: inline-block; }
    ::selection { background: #f48c0644; color: #fff; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }
    @media (max-width: 768px) {
      .layout { flex-direction: column !important; }
      .sidebar { position: static !important; min-width: 0 !important; }
      .sidebar-inner { display: flex; flex-wrap: wrap; gap: 4px; }
      .sidebar-inner button { flex: 1; min-width: 100px; padding: 8px 10px !important; font-size: 12px !important; }
      .sidebar-inner button span.icon { display: none; }
      .main-content { padding: 20px 16px !important; }
      .header-title { font-size: 18px !important; }
      .cards-grid { grid-template-columns: 1fr !important; }
      .arch-diagram { font-size: 11px !important; overflow-x: auto; }
      .sources-box { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useEffect, useContext, createContext } = React;

    /* ─── i18n ─── */

    const META = {
      es: {
        title: 'FlexNet Agents — Guía de Instalación y Configuración',
        description: 'Guía completa de instalación y configuración de FlexNet Agents de Flexera para Windows, Linux, macOS y Contenedores.',
      },
      en: {
        title: 'FlexNet Agents — Installation and Configuration Guide',
        description: 'Complete installation and configuration guide for Flexera FlexNet Agents on Windows, Linux, macOS and Containers.',
      },
    };

    function detectLang() {
      try {
        const q = new URLSearchParams(window.location.search).get('lang');
        if (q === 'es' || q === 'en') return q;
      } catch (e) {}
      try {
        const saved = window.localStorage.getItem('flexera-guide-lang');
        if (saved === 'es' || saved === 'en') return saved;
      } catch (e) {}
      const nav = (navigator.language || 'es').toLowerCase();
      return nav.startsWith('es') ? 'es' : 'en';
    }

    const LangContext = createContext({ lang: 'es', t: (es) => es });
    const useLang = () => useContext(LangContext);

    /* ─── Utility Components ─── */

    function CodeBlock({ children, title }) {
      const { t } = useLang();
      const [copied, setCopied] = useState(false);
      const handleCopy = useCallback(() => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(children);
        } else {
          const ta = document.createElement('textarea');
          ta.value = children;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }, [children]);

      return (
        <div style={{ margin: '16px 0', borderRadius: 8, overflow: 'hidden', border: '1px solid #2a2a3a' }}>
          {title && (
            <div style={{ background: '#1a1a2e', padding: '8px 16px', fontSize: 12, color: '#8892b0', fontFamily: "'SF Mono', Consolas, monospace", display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
              <span>{title}</span>
              <button onClick={handleCopy} style={{ background: 'none', border: '1px solid #333', color: copied ? '#26a269' : '#8892b0', padding: '2px 10px', borderRadius: 4, cursor: 'pointer', fontSize: 11, transition: 'color 0.2s' }}>
                {copied ? t('✓ Copiado', '✓ Copied') : t('Copiar', 'Copy')}
              </button>
            </div>
          )}
          <pre style={{ background: '#0d1117', padding: 16, margin: 0, overflowX: 'auto', fontSize: 13, lineHeight: 1.6, color: '#c9d1d9', fontFamily: "'SF Mono', Consolas, monospace" }}>
            <code>{children}</code>
          </pre>
        </div>
      );
    }

    function InfoBox({ type = 'info', children }) {
      const { t } = useLang();
      const styles = {
        info:    { bg: '#0d2847', border: '#1a5fb4', icon: 'ℹ️', label: t('Información', 'Information') },
        warning: { bg: '#3d2e00', border: '#c4a000', icon: '⚠️', label: t('Advertencia', 'Warning') },
        danger:  { bg: '#3d0000', border: '#c01c28', icon: '🚨', label: t('Importante', 'Important') },
        tip:     { bg: '#0d3324', border: '#26a269', icon: '💡', label: t('Consejo', 'Tip') },
      };
      const s = styles[type];
      return (
        <div style={{ margin: '16px 0', padding: '14px 18px', borderRadius: 8, background: s.bg, borderLeft: '4px solid ' + s.border, fontSize: 14, lineHeight: 1.7, color: '#e0e0e0' }}>
          <strong style={{ color: s.border }}>{s.icon} {s.label}:</strong>{' '}
          {children}
        </div>
      );
    }

    function StepCard({ number, title, children }) {
      return (
        <div style={{ display: 'flex', gap: 16, margin: '20px 0' }}>
          <div style={{ minWidth: 38, height: 38, borderRadius: '50%', background: 'linear-gradient(135deg, #e85d04, #f48c06)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 16, color: '#fff', flexShrink: 0, marginTop: 2 }}>
            {number}
          </div>
          <div style={{ flex: 1 }}>
            <h4 style={{ margin: '0 0 8px', fontSize: 16, color: '#f0f0f0', fontWeight: 700 }}>{title}</h4>
            <div style={{ color: '#b0b8c8', lineHeight: 1.75, fontSize: 14 }}>{children}</div>
          </div>
        </div>
      );
    }

    function Badge({ children, color = '#e85d04' }) {
      return (
        <span style={{ display: 'inline-block', background: color + '22', color, padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', border: '1px solid ' + color + '44' }}>
          {children}
        </span>
      );
    }

    function TRow({ cells, header }) {
      const Tag = header ? 'th' : 'td';
      return (
        <tr>
          {cells.map((c, i) => (
            <Tag key={i} style={{ padding: '10px 14px', borderBottom: '1px solid #1e2a3a', textAlign: 'left', fontSize: 13, color: header ? '#f48c06' : '#c0c8d8', fontWeight: header ? 700 : 400, background: header ? '#0d1117' : 'transparent' }}>{c}</Tag>
          ))}
        </tr>
      );
    }

    function SubTabs({ tabs, active, onChange }) {
      return (
        <div style={{ display: 'flex', gap: 8, marginBottom: 24, flexWrap: 'wrap' }}>
          {tabs.map(tb => (
            <button key={tb.id} onClick={() => onChange(tb.id)} style={{ padding: '8px 18px', borderRadius: 8, border: active === tb.id ? '1px solid #f48c06' : '1px solid #1e2a3a', background: active === tb.id ? '#f48c0618' : '#111827', color: active === tb.id ? '#f48c06' : '#8892b0', cursor: 'pointer', fontSize: 13, fontWeight: 600, transition: 'all 0.2s' }}>
              {tb.label}
            </button>
          ))}
        </div>
      );
    }

    /* ─── Official Flexera documentation links (all URLs verified against docs.flexera.com) ─── */

    const GATHER = 'https://docs.flexera.com/fnms/EN/GatherFNInv/SysRef/FlexNetInventoryAgent';
    const K8S = 'https://docs.flexera.com/fnms/EN/GatherFNInv/SysRef/KubernetesAgents';
    const DOC = {
      home:           'https://docs.flexera.com/',
      community:      'https://community.flexera.com/',
      plc:            'https://flexerasoftware.flexnetoperations.com',
      fiaSysReqs:     GATHER + '/topics/FIA-SystemReqs.html',
      coDepSysReqs:   GATHER + '/topics/CoDep-SystemReqs.html',
      zfaSysReqs:     'https://docs.flexera.com/FlexNetManagerSuite2022R2/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/ZFA-SystemReqs.html',
      fisSysReqs:     'https://docs.flexera.com/FlexNetManagerSuite2022R2/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/FIS-SystemReqs.html',
      fa3Impl:        'https://docs.flexera.com/FlexNetManagerSuite2025R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/FA3-ImplemIntro.html',
      fa3CustomUnix:  'https://docs.flexera.com/FlexNetManagerSuite2024R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/FA3-CustomForUNIX.html',
      fa3InstallUnix: GATHER + '/tasks/FA3-InstallUNIX.html',
      fa3SetupIni:    GATHER + '/tasks/FA3-CustomSetupIni.html',
      fa3Sample:      'https://docs.flexera.com/fnms/EN/GatherFNInv/index.html#SysRef/FlexNetInventoryAgent/topics/FA3-SampleBootstrap.html',
      fiaTrouble:     GATHER + '/tasks/FIA-Troubleshooting.html',
      fa3Trouble:     'https://docs.flexera.com/FlexNetManagerSuite2024R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/tasks/FA3-Troubleshooting.html',
      fisTrouble:     GATHER + '/tasks/FIS-Troubleshooting.html',
      zfaTrouble:     'https://docs.flexera.com/FlexNetManagerSuite2024R2/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/tasks/ZFA-Troubleshooting.html',
      logFile:        GATHER + '/topics/PMD-LogFile.html',
      commandLines:   GATHER + '/topics/CommandLinesIntro.html',
      flxconfig:      GATHER + '/reference/flxconfig-CommandLine.html',
      flxconfigNews:  'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/RN-new-flxconfig.htm',
      httpProxy:      GATHER + '/topics/PMD-HTTP_Proxy.html',
      httpsProxy:     'https://docs.flexera.com/fnms/EN/GatherFNInv/index.html#SysRef/FlexNetInventoryAgent/topics/PMD-HTTPS_Proxy.html',
      noProxy:        'https://docs.flexera.com/FlexNetManagerSuite2024R1/EN/GatherFNInv/SysRef/FlexNetInventoryAgent/topics/PMD-NoProxy.html',
      noProxyKnown:   'https://community.flexera.com/t5/FlexNet-Manager-Suite-Known/Known-Issue-no-proxy-preference-setting-is-ignored-by-FlexNet/ta-p/219275',
      beaconProxy:    'https://docs.flexera.com/fnms/EN/WebHelp/tasks/FIB-Proxies.html',
      versionSpec:    'https://docs.flexera.com/FlexNetManagerSuite2025R1/EN/WebHelp/tasks/FIA-VersionSpec.html',
      changelog:      'https://docs.flexera.com/flexera/EN/Beacons/AgentChangeLog.htm',
      networkReqs:    'https://docs.flexera.com/fnms/EN/SysReq/FNMS_sys_req/RN_sys_req_network.html',
      portsKb:        'https://community.flexera.com/t5/FlexNet-Manager-Knowledge-Base/Ports-Required-by-the-FlexNet-Manager-Suite-Core-Compliance/ta-p/5805',
      logsKb:         'https://community.flexera.com/s/article/flexnet-manager-suite-log-files-and-locations',
      fnmeaAgent:     'https://docs.flexera.com/fnmea/AgentInstallationGuide/Content/helplibrary/Introduction_and_Overview.htm',
      fnmeaWizard:    'https://docs.flexera.com/fnmea/2020r1/AgentInstallationGuide/Content/helplibrary/Installing_Using_the_InstallAnywhere_Installation_Wizard_on_Microsoft_Windo.htm',
      fnmeaInstall:   'https://docs.flexera.com/fnmea/InstallationGuide/Content/helplibrary/_Installation_Guide_.htm',
      fnmeaConcept:   'https://docs.flexera.com/fnmea/ConceptGuide/Content/helplibrary/fnmc_02_overview.htm',
      k8sTwo:         K8S + '/topics/TwoKAgentsIntro.html',
      k8sDownload:    'https://docs.flexera.com/fnms/EN/WebHelp/tasks/InvSet-KubAgentDownload.html',
      k8sExamples:    'https://docs.flexera.com/fnms/EN/WebHelp/topics/InvSet-KRMExamples.html',
      k8sFeatures:    'https://docs.flexera.com/fnms/EN/WebHelp/topics/InvSet-KubAgentFeatures.html',
      k8sPermissions: 'https://docs.flexera.com/FlexNetManagerSuite2025R2/EN/GatherFNInv/SysRef/KubernetesAgents/topics/PermissionsOverview.html',
      lwkDownload:    K8S + '/tasks/lwk-Download.html',
      lwkScripted:    K8S + '/tasks/lwk-ScriptedInstall.html',
      lwkManual:      K8S + '/tasks/lwk-ManualInstall.html',
      lwkHelm:        K8S + '/topics/lwk-ValuesConfigOptions.html',
      helmNews:       'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/RN-new-HelmCharts.htm',
      krmChart:       'https://gallery.ecr.aws/flexera/krm-chart',
      lwkChart:       'https://gallery.ecr.aws/flexera/lwk-chart',
      k8sUninstall:   'https://docs.flexera.com/flexera/EN/ITAssets/InvSet-Uninstall.htm',
      installersNews: 'https://docs.flexera.com/flexeraone/EN/WhatsNew/FeatureList/2024FEB-ITV-Kubernetes-Agent-FLEX-1007.htm',
      containerMon:   'https://docs.flexera.com/flexera/EN/ITAssets/flexera-container-monitor.htm',
    };

    function Ext({ href, children }) {
      return <a className="doc-link" href={href} target="_blank" rel="noopener noreferrer" style={{ color: '#1a85ff', textDecoration: 'none' }}>{children} ↗</a>;
    }

    function DocLinks({ links }) {
      const { t } = useLang();
      return (
        <div style={{ margin: '28px 0 8px', padding: '14px 18px', borderRadius: 8, background: '#0d1117', border: '1px solid #1e2a3a' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: '#f48c06', marginBottom: 8 }}>📖 {t('Documentación oficial de Flexera', 'Official Flexera documentation')}</div>
          <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 6 }}>
            {links.map((l, i) => (
              <li key={i} style={{ fontSize: 13, lineHeight: 1.6 }}>
                <Ext href={l.url}>{l.label}</Ext>
                {l.note && <span style={{ color: '#6e7b91' }}> — {l.note}</span>}
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LangSwitch() {
      const { lang, setLang } = useLang();
      const opt = (id, label) => (
        <button key={id} onClick={() => setLang(id)} aria-pressed={lang === id}
          style={{ padding: '6px 14px', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 700, letterSpacing: 0.5, background: lang === id ? '#f48c06' : 'transparent', color: lang === id ? '#0a0e1a' : '#8892b0', transition: 'all 0.15s' }}>
          {label}
        </button>
      );
      return (
        <div role="group" aria-label="Language" style={{ marginLeft: 'auto', display: 'flex', borderRadius: 8, overflow: 'hidden', border: '1px solid #2a2a3a', background: '#111827' }}>
          {opt('es', 'ES')}
          {opt('en', 'EN')}
        </div>
      );
    }

    /* ─── Section: Overview ─── */

    function OverviewContent() {
      const { t } = useLang();
      const cards = [
        { title: 'FlexNet Agent (Eng. Apps)', ver: 'v5.17',
          desc: t('Se instala en cada máquina con servidor de licencias FlexNet Publisher. Comunica datos de uso al servidor FlexNet Manager for Engineering Applications.',
                  'Installed on every machine running a FlexNet Publisher license server. Reports usage data to the FlexNet Manager for Engineering Applications server.'),
          tags: [t('Licencias concurrentes', 'Concurrent licenses'), t('Uso de software', 'Software usage'), 'lmgrd/lmstat'] },
        { title: 'FlexNet Inventory Agent (FNMS)', ver: 'v17.x+',
          desc: t('Se despliega en dispositivos gestionados para recolectar inventario de hardware y software. Se comunica con Inventory Beacons que reportan al servidor central.',
                  'Deployed on managed devices to collect hardware and software inventory. Communicates with Inventory Beacons, which report to the central server.'),
          tags: [t('Inventario SW/HW', 'SW/HW inventory'), 'Discovery', 'Compliance'] },
        { title: 'Flexera Kubernetes Inv. Agent', ver: '2024+',
          desc: t('Agente específico para recolectar inventario de clústeres Kubernetes: nodos, pods, imágenes de contenedor y software dentro de ellas.',
                  'Dedicated agent that collects inventory from Kubernetes clusters: nodes, pods, container images and the software inside them.'),
          tags: ['Kubernetes', 'OCI', t('Contenedores', 'Containers')] },
      ];
      return (
        <div>
          <h2 style={{ color: '#f0f0f0', fontSize: 26, margin: '0 0 8px', fontWeight: 800 }}>{t('¿Qué son los FlexNet Agents?', 'What are FlexNet Agents?')}</h2>
          <p style={{ color: '#8892b0', fontSize: 15, lineHeight: 1.8, margin: '0 0 20px' }}>
            {t(
              <>Flexera ofrece distintos tipos de agentes según el producto y objetivo. Los dos principales son el <strong style={{ color: '#f48c06' }}>FlexNet Agent</strong> (para Engineering Applications) y el <strong style={{ color: '#f48c06' }}>FlexNet Inventory Agent</strong> (para IT Asset Management / FlexNet Manager Suite). Esta guía cubre ambos.</>,
              <>Flexera offers different types of agents depending on the product and the goal. The two main ones are the <strong style={{ color: '#f48c06' }}>FlexNet Agent</strong> (for Engineering Applications) and the <strong style={{ color: '#f48c06' }}>FlexNet Inventory Agent</strong> (for IT Asset Management / FlexNet Manager Suite). This guide covers both.</>
            )}
          </p>
          <div className="cards-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, margin: '24px 0' }}>
            {cards.map((c, i) => (
              <div key={i} style={{ background: '#111827', border: '1px solid #1e2a3a', borderRadius: 12, padding: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
                  <h3 style={{ color: '#f0f0f0', fontSize: 16, margin: 0, fontWeight: 700 }}>{c.title}</h3>
                  <Badge>{c.ver}</Badge>
                </div>
                <p style={{ color: '#8892b0', fontSize: 13, lineHeight: 1.7, margin: '0 0 14px' }}>{c.desc}</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                  {c.tags.map((tg, j) => <span key={j} style={{ fontSize: 11, padding: '3px 8px', borderRadius: 6, background: '#1a2332', color: '#6e8bb8', border: '1px solid #253347' }}>{tg}</span>)}
                </div>
              </div>
            ))}
          </div>

          <h3 style={{ color: '#f0f0f0', fontSize: 18, marginTop: 32 }}>{t('Métodos de recolección de inventario', 'Inventory collection methods')}</h3>
          <p style={{ color: '#8892b0', fontSize: 14, lineHeight: 1.7, margin: '8px 0 0' }}>
            {t('Un mismo dispositivo puede inventariarse de formas distintas según la huella y el control que necesites. La documentación oficial los denomina así:',
               'A device can be inventoried in different ways depending on the footprint and control you need. The official documentation names them as follows:')}
          </p>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 12 }}>
              <thead><TRow header cells={[t('Método', 'Method'), t('Descripción', 'Description'), t('Documentación', 'Documentation')]} /></thead>
              <tbody>
                <TRow cells={['Adopted', t('Agente completo instalado y gestionado por el Inventory Beacon (adopción). Se rige por políticas y puede auto-actualizarse.', 'Full agent installed and managed by the Inventory Beacon (adoption). Policy-driven and able to self-upgrade.'), <Ext href={DOC.fiaSysReqs}>{t('Requisitos', 'System requirements')}</Ext>]} />
                <TRow cells={['Third-party deployment', t('Agente completo instalado con tu propia herramienta de despliegue (SCCM, GPO, etc.); después se gobierna por política.', 'Full agent installed with your own deployment tool (SCCM, GPO, etc.); policy-driven afterwards.'), <Ext href={DOC.fa3Impl}>{t('Implementación', 'Implementation')}</Ext>]} />
                <TRow cells={['Zero-footprint', t('El beacon ejecuta ndtrack de forma remota en el dispositivo; no se instala un agente persistente.', 'The beacon runs ndtrack remotely on the device; no persistent agent is installed.'), <Ext href={DOC.zfaSysReqs}>{t('Requisitos', 'System requirements')}</Ext>]} />
                <TRow cells={['FlexNet Inventory Scanner', t('Herramienta autónoma que se ejecuta a demanda en el dispositivo para generar el inventario.', 'Standalone tool run on demand on the device to produce the inventory.'), <Ext href={DOC.fisSysReqs}>{t('Requisitos', 'System requirements')}</Ext>]} />
              </tbody>
            </table>
          </div>
          <InfoBox type="tip">
            {t(<>La documentación de Flexera se publica por edición: las rutas <code>docs.flexera.com/fnms/EN/…</code> corresponden a <strong>IT Asset Management (Cloud)</strong> y las rutas con versión (p. ej. <code>FlexNetManagerSuite2025R1</code>) a las ediciones <strong>On-Premises</strong>. Consulta siempre la que coincida con tu instalación.</>,
               <>Flexera documentation is published per edition: <code>docs.flexera.com/fnms/EN/…</code> paths cover <strong>IT Asset Management (Cloud)</strong>, while versioned paths (e.g. <code>FlexNetManagerSuite2025R1</code>) cover the <strong>On-Premises</strong> editions. Always use the one that matches your installation.</>)}
          </InfoBox>

          <h3 style={{ color: '#f0f0f0', fontSize: 18, marginTop: 32 }}>{t('Requisitos Generales Comunes', 'Common General Requirements')}</h3>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 12 }}>
              <thead><TRow header cells={[t('Requisito', 'Requirement'), 'FlexNet Agent (Eng. Apps)', 'FlexNet Inventory Agent']} /></thead>
              <tbody>
                <TRow cells={[t('Arquitectura', 'Architecture'), t('64-bit obligatorio (Windows y Linux)', '64-bit required (Windows and Linux)'), t('64-bit recomendado', '64-bit recommended')]} />
                <TRow cells={[t('RAM mínima', 'Minimum RAM'), t('512 MB recomendado', '512 MB recommended'), t('Mín. 512 MB · 2 GB recomendado', 'Min. 512 MB · 2 GB recommended')]} />
                <TRow cells={[t('Puertos por defecto', 'Default ports'), t('Puerto del servidor FNMEA (ej. 443/8888)', 'FNMEA server port (e.g. 443/8888)'), t('HTTP 80 · HTTPS 443 (subida/descarga con el beacon)', 'HTTP 80 · HTTPS 443 (beacon upload/download)')]} />
                <TRow cells={[t('Permisos', 'Permissions'), t('Administrador local / root', 'Local administrator / root'), t('Administrador / root (servicios del sistema)', 'Administrator / root (system services)')]} />
                <TRow cells={[t('Conectividad', 'Connectivity'), t('Al servidor FlexNet Manager', 'To the FlexNet Manager server'), t('Al Inventory Beacon asignado', 'To the assigned Inventory Beacon')]} />
              </tbody>
            </table>
          </div>
          <InfoBox type="info">
            {t(

                {t(<>

                  2. Detecta inicio de contenedor desde imagen<br/>
                  3. Carga ndtrack DENTRO del contenedor en ejecución<br/>

                  5. Remueve ndtrack del contenedor (zero footprint)<br/>

                  2. Detects a container starting from an image<br/>
                  3. Loads ndtrack INSIDE the running container<br/>
                  4. Runs the inventory · Reports to the host<br/>
                  5. Removes ndtrack from the container (zero footprint)<br/>
                  6. Only once per image (images are immutable)
                </>)}

                 <>In <strong>Discovery &amp; Inventory → Settings → Container scanning</strong>:</>)}

                </div>
              ))}

            <StepCard number={2} title={t('Esperar propagación', 'Wait for propagation')}>

                 <>The policy propagates via beacons. It can take <strong>24-48 hours</strong> until the inventory is processed.</>)}

                 'According to the agent change log: 24.1.1 fixes Podman/Docker monitor services not being enabled and started after installation (affected 23.5.0–24.1.0), 24.2.0 fixes the Podman monitor for user IDs above 2000, and 25.0.0 fixes Docker monitor reconnection after a Docker restart. If you see inventory gaps, check your agent version.')}
            </InfoBox>
            <DocLinks links={[
              { label: 'Flexera Container Monitor', url: DOC.containerMon },
              { label: 'FlexNet Inventory Agent Change Log', url: DOC.changelog, note: t('Correcciones de los monitores Docker y Podman', 'Docker and Podman monitor fixes') },
              { label: 'Adopted: System Requirements', url: DOC.fiaSysReqs },

               'Check connectivity (telnet/curl to port 80/443). Verify the URLs in mgsft_rollout_response (UNIX) or mgssetup.ini (Windows). Review policy.log and uploader.log. Check the firewall/proxy.') },
        { q: t('Instalación silenciosa en Windows falla', 'Silent installation on Windows fails'),
          a: t('Asegúrate de ejecutar como Administrador real (cmd elevado). Verifica sintaxis de msiexec (sin espacios extra después de /v"). Revisa log con /l*v.',
               'Make sure you run as a real Administrator (elevated cmd). Check the msiexec syntax (no extra spaces after /v"). Review the log with /l*v.') },
        { q: t('Popup de Java en macOS', 'Java popup on macOS'),
          a: t('Problema conocido con Java viejo en /System/Library/Frameworks/JavaVM.framework. Excluir directorio del file scanning en Inventory Settings.',
               'Known issue with old Java in /System/Library/Frameworks/JavaVM.framework. Exclude the directory from file scanning in Inventory Settings.') },
        { q: t('Servicios no inician en Linux', 'Services do not start on Linux'),
          a: t('Verifica que mgsft_rollout_response existía en /var/tmp/ ANTES de instalar. Revisa /var/opt/managesoft/log/installation.log. Verificar instalación con sudo/root.',
               'Verify that mgsft_rollout_response existed in /var/tmp/ BEFORE installing. Review /var/opt/managesoft/log/installation.log. Verify the installation was done with sudo/root.') },
        { q: t('Inventario Docker no aparece', 'Docker inventory does not appear'),

               'Check that INSTALLMACHINEPOLICY is uncommented and set to true in mgssetup.ini (without it the agent waits for a policy) and that the [Custom Install Settings] URL ends in ManageSoftDL, is not a UNC path and does not exceed 80 characters. If the URL was wrong, the device is not managed and must be reinstalled.') },
        { q: t('Cómo activar trazas avanzadas (etcp.trace)', 'How to enable advanced tracing (etcp.trace)'),
          a: t('Edita etcp.trace, que está junto al ejecutable ndtrack (Windows: C:\\Program Files (x86)\\ManageSoft\\etcp.trace; UNIX: /opt/managesoft/etcp.trace). Descomenta una línea "filename=" (borra solo el # inicial) y ajústala, p. ej. filename=C:\\ManageSoft.log en Windows o filename=/tmp/log/mgstrace.log en UNIX.',
               'Edit etcp.trace, located next to the ndtrack executable (Windows: C:\\Program Files (x86)\\ManageSoft\\etcp.trace; UNIX: /opt/managesoft/etcp.trace). Uncomment a "filename=" line (delete only the leading #) and adjust it, e.g. filename=C:\\ManageSoft.log on Windows or filename=/tmp/log/mgstrace.log on UNIX.') },

               'With the full agent: on Windows, $(TempDirectory)\\ManageSoft\\tracker.log (the temp folder of the account running ndtrack); on UNIX-like, /var/opt/managesoft/log/tracker.log when ndtrack runs as root. With the Inventory Scanner on UNIX: /var/tmp/flexera/log/tracker.log, or /var/tmp/flexera.userName/log/ if not root.') },

              <TRow cells={[t('Linux (zero-touch, root)', 'Linux (zero-touch, root)'), '/var/tmp/flexera/log/']} />

          <InfoBox type="info">

               <>Monitor agent versions in the web console: <strong>Discovery &amp; Inventory → FlexNet Inventory Agent Status</strong>.</>)}

      const [lang, setLangState] = useState(detectLang);
      const [active, setActive] = useState('overview');

      const setLang = useCallback((l) => {
        setLangState(l);
        try { window.localStorage.setItem('flexera-guide-lang', l); } catch (e) {}
      }, []);
      const t = useCallback((es, en) => (lang === 'es' ? es : en), [lang]);

      useEffect(() => {
        document.documentElement.lang = lang;
        document.title = META[lang].title;
        const m = document.querySelector('meta[name="description"]');
        if (m) m.setAttribute('content', META[lang].description);
      }, [lang]);

      const SECTIONS = [
        { id: 'overview', title: t('Visión General', 'Overview'), icon: '📋' },
        { id: 'windows',  title: 'Windows',                        icon: '🪟' },
        { id: 'linux',    title: 'Linux',                          icon: '🐧' },
        { id: 'mac',      title: 'macOS',                          icon: '🍎' },
        { id: 'containers', title: t('Contenedores', 'Containers'), icon: '📦' },

        { id: 'troubleshooting', title: t('Problemas', 'Troubleshooting'), icon: '🔧' },
        { id: 'resources', title: t('Recursos', 'Resources'), icon: '📚' },
      ];
      const Content = CONTENT[active];

      return (

                  {SECTIONS.map(s => (
                    <button key={s.id} onClick={() => { setActive(s.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}

                      <span className="icon" style={{ fontSize: 18 }}>{s.icon}</span>{s.title}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
